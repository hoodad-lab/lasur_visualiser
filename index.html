  function renderVisualiser() {
    var area = ce('div', {cls:'vis-area'});
    var stage = ce('div', {cls:'stage-wrap ratio-stage'});

    var imgCanvas = ce('canvas', {cls:'image'});
    var maskCanvas = ce('canvas', {cls:'mask'});
    stage.appendChild(imgCanvas);
    stage.appendChild(maskCanvas);
    refs.imgCanvas = imgCanvas;
    refs.maskCanvas = maskCanvas;
    refs.stage = stage;

    var isMask = state.appMode === 'mask';
    var isSlider = state.viewMode === 'slider';
    var isH = state.sliderOrientation === 'horizontal';

    // Mask canvas events (paint or eyedropper)
    maskCanvas.addEventListener('mousedown', onPointerDown);
    maskCanvas.addEventListener('mousemove', onPointerMove);
    maskCanvas.addEventListener('mouseup', onPointerUp);
    maskCanvas.addEventListener('mouseleave', onPointerUp);
    maskCanvas.addEventListener('touchstart', onPointerDown, {passive:false});
    maskCanvas.addEventListener('touchmove', onPointerMove, {passive:false});
    maskCanvas.addEventListener('touchend', onPointerUp);

    if (isSlider) {
      // Drag layer (only when not in mask mode — otherwise paint takes priority)
      if (!isMask) {
        var dragLayer = ce('div', {cls:'drag-layer ' + (isH?'h':'v')});
        if (state.sampling) {
          // Sampling mode: clicks on the layer sample the underlying image
          dragLayer.style.cursor = 'crosshair';
          var doSample = function(e) {
            e.preventDefault();
            // Convert to image-canvas coordinates
            var rect = refs.imgCanvas.getBoundingClientRect();
            var t = e.touches ? e.touches[0] : e;
            var pos = {
              x: ((t.clientX - rect.left) / rect.width) * refs.imgCanvas.width,
              y: ((t.clientY - rect.top) / rect.height) * refs.imgCanvas.height
            };
            sampleAt(pos);
            state.sampling = false;
            render();
          };
          dragLayer.addEventListener('mousedown', doSample);
          dragLayer.addEventListener('touchstart', doSample, {passive:false});
        } else {
          dragLayer.addEventListener('mousedown', onSliderDown);
          dragLayer.addEventListener('touchstart', onSliderDown, {passive:false});
        }
        stage.appendChild(dragLayer);
      }
      var divider = ce('div', {cls:'divider ' + (isH?'h':'v')});
      stage.appendChild(divider);
      refs.divider = divider;

      var handle = ce('button', {
        cls:'handle ' + (isH?'h':'v'),
        html: isH
          ? svgUse('i-chev-up', 14) + svgUse('i-chev-down', 14)
          : svgUse('i-chev-left', 14) + svgUse('i-chev-right', 14)
      });
      handle.addEventListener('mousedown', onSliderDown);
      handle.addEventListener('touchstart', onSliderDown, {passive:false});
      handle.addEventListener('dblclick', function() { state.sliderPos = 50; updateSliderUI(); });
      if (isH) handle.style.flexDirection = 'column';
      stage.appendChild(handle);
      refs.handle = handle;

      // Labels
      var origLabel = ce('div', {cls:'stage-label original', text:'Original'});
      stage.appendChild(origLabel);
      refs.origLabel = origLabel;

      var keimMatch = findKeim(state.color);
      var treatedClass = isH ? 'bottom-right' : 'top-right';
      var treatedLabel = ce('div', {cls:'stage-label treated ' + treatedClass});
      treatedLabel.innerHTML = '<span class="swatch-dot" style="background:' + state.color + '"></span><span class="badge-text">'
        + (keimMatch ? 'KEIM ' + keimMatch.n : 'Custom') + ' · ' + dilutionLabel() + '</span>';
      stage.appendChild(treatedLabel);
      refs.treatedLabel = treatedLabel;
    }

    // Floating action stack on the canvas
    var fabStack = ce('div', {cls:'fab-stack'});

    // Eyedropper — pick a colour from the image
    var fabSample = ce('button', {
      cls:'fab' + (state.sampling ? ' sampling' : ''),
      html: svgUse('i-pipette', 18),
      attr:{title: state.sampling ? 'Tap the wall to sample a colour' : 'Pick colour from image'},
      on:{click: function() {
        state.sampling = !state.sampling;
        if (state.sampling) state.appMode = 'full';
        render();
      }}
    });
    fabStack.appendChild(fabSample);

    if (isMask) {
      // In paint mode: show tool selector pills right on the canvas
      var toolPills = ce('div', {cls:'fab-tools'});

      var brushPill = ce('button', {
        cls: 'fab-tool' + (state.tool === 'brush' ? ' active' : ''),
        html: svgUse('i-brush', 16) + '<span>Brush</span>',
        on:{click: function() { state.tool = 'brush'; render(); }}
      });
      var rollerPill = ce('button', {
        cls: 'fab-tool' + (state.tool === 'roller' ? ' active' : ''),
        html: svgUse('i-roller', 16) + '<span>Roller</span>',
        on:{click: function() { state.tool = 'roller'; render(); }}
      });
      var eraserPill = ce('button', {
        cls: 'fab-tool' + (state.tool === 'eraser' ? ' active' : ''),
        html: svgUse('i-eraser', 16) + '<span>Eraser</span>',
        on:{click: function() { state.tool = 'eraser'; render(); }}
      });
      var clearPill = ce('button', {
        cls: 'fab-tool fab-tool-clear',
        html: svgUse('i-trash', 14) + '<span>Clear</span>',
        on:{click: function() {
          clearMask();
          render();
        }}
      });
      var donePill = ce('button', {
        cls: 'fab-tool fab-tool-done',
        html: svgUse('i-check', 14) + '<span>Done</span>',
        on:{click: function() {
          saveMaskContent();
          state.appMode = 'full'; render();
        }}
      });

      toolPills.appendChild(brushPill);
      toolPills.appendChild(rollerPill);
      toolPills.appendChild(eraserPill);
      toolPills.appendChild(clearPill);
      toolPills.appendChild(donePill);
      fabStack.appendChild(toolPills);
    } else {
      // Not in paint mode: single button to enter
      var fabPaint = ce('button', {
        cls: 'fab',
        html: svgUse('i-brush', 18),
        attr:{title: 'Paint walls manually'},
        on:{click: function() {
          state.sampling = false;
          state.appMode = 'mask';
          render();
        }}
      });
      fabStack.appendChild(fabPaint);
    }
    stage.appendChild(fabStack);

    // Paint-mode hint — tells the user the walls are auto-detected and
    // they can refine. Only shows once per upload (driven by paintHintShown).
    if (isMask && state.wallMask && !state.paintHintShown) {
      var paintHint = ce('div', {cls:'paint-hint', text:'Walls auto-detected — paint to add, erase to remove'});
      stage.appendChild(paintHint);
      state.paintHintShown = true;
      // Fade after 4 seconds
      setTimeout(function() {
        if (paintHint.parentNode) {
          paintHint.style.opacity = '0';
          setTimeout(function() { if (paintHint.parentNode) paintHint.remove(); }, 400);
        }
      }, 4000);
    }

    // Sampling hint banner — shows while sampling mode is active
    if (state.sampling) {
      var hint = ce('div', {cls:'sampling-hint', text:'Move over the wall — tap to sample'});
      stage.appendChild(hint);
      stage.style.cursor = 'crosshair';

      // Loupe: a circular magnifier that follows the cursor and shows the
      // exact pixel under the crosshair, helping pinpoint subtle colour
      // variations on textured substrates.
      var loupe = ce('div', {cls:'loupe', style:{opacity: '0'}});
      var loupeCanvas = ce('canvas', {attr:{width: 30, height: 30}});
      loupe.appendChild(loupeCanvas);
      loupe.appendChild(ce('div', {cls:'loupe-pixel'}));
      var loupeHex = ce('div', {cls:'loupe-hex', text:'#'});
      loupe.appendChild(loupeHex);
      stage.appendChild(loupe);
      refs.loupe = loupe;
      refs.loupeCanvas = loupeCanvas;
      refs.loupeHex = loupeHex;

      // Track pointer over the stage to update the loupe live
      var moveLoupe = function(e) {
        if (!refs.imgCanvas || !refs.loupe) return;
        var t = e.touches ? e.touches[0] : e;
        var stageRect = stage.getBoundingClientRect();
        var imgRect = refs.imgCanvas.getBoundingClientRect();
        // Pointer position relative to stage (for loupe placement)
        var relX = t.clientX - stageRect.left;
        var relY = t.clientY - stageRect.top;
        // Pointer position in image-canvas pixel space (for sample read)
        var px = ((t.clientX - imgRect.left) / imgRect.width) * refs.imgCanvas.width;
        var py = ((t.clientY - imgRect.top) / imgRect.height) * refs.imgCanvas.height;
        if (px < 0 || py < 0 || px >= refs.imgCanvas.width || py >= refs.imgCanvas.height) {
          refs.loupe.style.opacity = '0';
          return;
        }
        refs.loupe.style.opacity = '1';
        refs.loupe.style.left = relX + 'px';
        refs.loupe.style.top = relY + 'px';
        // Draw a 30x30 region centred on the cursor into the loupe canvas.
        // The CSS scales it up to 120px, so each source pixel becomes 4x4 px.
        var srcSize = 30;
        var sx = Math.max(0, Math.min(refs.imgCanvas.width - srcSize, Math.floor(px - srcSize / 2)));
        var sy = Math.max(0, Math.min(refs.imgCanvas.height - srcSize, Math.floor(py - srcSize / 2)));
        var lctx = refs.loupeCanvas.getContext('2d');
        lctx.imageSmoothingEnabled = false;
        lctx.clearRect(0, 0, srcSize, srcSize);
        lctx.drawImage(refs.imgCanvas, sx, sy, srcSize, srcSize, 0, 0, srcSize, srcSize);
        // Read the centre pixel for the live hex readout
        var cx = Math.max(0, Math.min(refs.imgCanvas.width - 1, Math.floor(px)));
        var cy = Math.max(0, Math.min(refs.imgCanvas.height - 1, Math.floor(py)));
        var pix = refs.imgCanvas.getContext('2d').getImageData(cx, cy, 1, 1).data;
        var hex = '#' + [pix[0], pix[1], pix[2]].map(function(v) {
          var s = v.toString(16); return s.length === 1 ? '0' + s : s;
        }).join('').toUpperCase();
        refs.loupeHex.textContent = hex;
      };
      var hideLoupe = function() {
        if (refs.loupe) refs.loupe.style.opacity = '0';
      };
      stage.addEventListener('mousemove', moveLoupe);
      stage.addEventListener('mouseleave', hideLoupe);
      stage.addEventListener('touchmove', moveLoupe, {passive:false});
      stage.addEventListener('touchstart', moveLoupe, {passive:false});
    }

    area.appendChild(stage);
    return area;
  }

  function renderBottomBar() {
    var bar = ce('div', {cls:'bottom-bar'});

    // 1. Controls row (context-sensitive)
    if (state.appMode === 'mask') {
      bar.appendChild(renderPaintRow());
    } else {
      bar.appendChild(renderStrengthRow());
    }

    // 2. Colour bar — always visible
    bar.appendChild(renderColourBar());

    // 3. Sampled colours — when samples exist, shown between colour bar and strip
    if (state.samples && state.samples.length) {
      bar.appendChild(renderSamplesPanel());
    }

    // 4. Colour strip — always visible
    bar.appendChild(renderColorStrip());

    return bar;
  }

  function renderStrengthRow() {
    var row = ce('div', {cls:'controls-row'});
    row.appendChild(ce('span', {cls:'strength-label', text:'Light'}));
    var slider = ce('input', {
      attr:{ type:'range', min:'0', max: String(DILUTIONS.length - 1), step:'1', value: String(state.dilutionIdx) },
      on:{input: function(e) {
        state.dilutionIdx = Number(e.target.value);
        updateLiveAfterDilutionChange();
        updateMixerVisual();
      }}
    });
    row.appendChild(slider);
    row.appendChild(ce('span', {cls:'strength-label', text:'Strong'}));

    // ── Mixer visualisation ──────────────────────────────────────────────
    // Shows two "buckets" side by side at heights proportional to the
    // current ratio, plus a result swatch on the right showing the mixed
    // outcome on a mid-grey substrate.
    var mixer = ce('div', {cls:'mixer'});

    // Bucket SVG template — outline plus a clipPath following the body shape.
    // The fill rect inside the clipPath grows from the bottom based on ratio.
    function bucketSVG(id, fillClass) {
      return ''
        + '<svg viewBox="0 0 48 56">'
        + '  <defs>'
        + '    <clipPath id="' + id + '">'
        // Body shape: tapered trapezoid with rounded bottom corners
        + '      <path d="M 8 16 L 14 50 Q 14 52 16 52 L 32 52 Q 34 52 34 50 L 40 16 Z"/>'
        + '    </clipPath>'
        + '  </defs>'
        // Handle — semicircle arc above the rim
        + '  <path d="M 14 16 Q 14 4 24 4 Q 34 4 34 16" '
        +       'fill="none" stroke="rgba(220,220,220,0.7)" stroke-width="2" stroke-linecap="round"/>'
        // Body fill — clipped rect that grows from bottom
        + '  <rect class="bucket-fill ' + fillClass + '" x="0" y="56" width="48" height="56" '
        +        'clip-path="url(#' + id + ')"/>'
        // Body outline
        + '  <path d="M 8 16 L 14 50 Q 14 52 16 52 L 32 52 Q 34 52 34 50 L 40 16 Z" '
        +       'fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.5" stroke-linejoin="round"/>'
        // Rim line — small horizontal line at the top of the body
        + '  <line x1="7" y1="16" x2="41" y2="16" '
        +       'stroke="rgba(255,255,255,0.65)" stroke-width="1.5" stroke-linecap="round"/>'
        + '</svg>';

  // Parse a ratio label like "1:6" or "2:3" into {p, f}
  function parseRatio(label) {
    var m = label.split(':');
    return {p: parseInt(m[0], 10), f: parseInt(m[1], 10)};
  }

  function updateMixerVisual() {
    if (!refs.mixer) return;
    var r  = parseRatio(dilutionLabel());
    var max = Math.max(r.p, r.f, 1);
    var pPct = r.p / max;  // 0..1
    var fPct = r.f / max;  // 0..1

    // SVG fill: bucket interior is from y=16 (rim) to y=52 (bottom curve start).
    // Fill height = 36 * pct, rendered as rect with y = 52 - fillHeight, height = fillHeight + 4
    // (extra 4 covers the rounded bottom arc).
    function setFill(bucket, pct, color, isPattern) {
      var fillRect = bucket.querySelector('.bucket-fill');
      if (!fillRect) return;
      var fillH = 36 * pct;
      fillRect.setAttribute('y', String(52 - fillH));
      fillRect.setAttribute('height', String(fillH + 4));
      if (isPattern) {
        // diagonal stripes via inline pattern fill
        fillRect.setAttribute('fill', 'rgba(255,255,255,0.18)');
      } else {
        fillRect.setAttribute('fill', color);
      }
    }

    setFill(refs.mixer.pigBucket, pPct, state.color, false);
    setFill(refs.mixer.fixBucket, fPct, '', true);

    refs.mixer.pigBucket.querySelector('.mixer-num-pig').textContent = r.p;
    refs.mixer.fixBucket.querySelector('.mixer-num-fix').textContent = r.f;

    refs.mixer.resultSwatch.style.background = computeMixedColor(state.color, dilutionValue());
  }

  // Compute what the colour looks like multiplied onto a mid-grey concrete
  function computeMixedColor(hex, strengthPct) {
    var p = hexToRgb(hex);
    if (!p) return hex;
    var s = strengthPct / 100;
    var sub = 175;
    if (strengthPct >= 100) {
      return hex; // 1:0 = pure colour
    }
    // multiply(lerp(white, paint, s), sub) / 255
    var fr = 255 + (p.r - 255) * s;
    var fg = 255 + (p.g - 255) * s;
    var fb = 255 + (p.b - 255) * s;
    var rr = Math.round(fr * sub / 255);
    var rg = Math.round(fg * sub / 255);
    var rb = Math.round(fb * sub / 255);
    return 'rgb(' + rr + ',' + rg + ',' + rb + ')';
  }

            activeEl.scrollIntoView();
          }

      });

  // ---------------- ACTIONS ----------------
  function loadFile(file) {
    if (!file || !file.type || file.type.indexOf('image/')!==0) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var maxDim = 1400;
        var w = img.width, h = img.height;
        if (w > maxDim) { h = h*(maxDim/w); w = maxDim; }
        if (h > maxDim) { w = w*(maxDim/h); h = maxDim; }
        state.image = img;
        state.imageW = Math.round(w);
        state.imageH = Math.round(h);
        state.sliderPos = 50;
        // Pre-compute on a working canvas (used for both dominant + wall mask)
        var tmp = document.createElement('canvas');
        tmp.width = state.imageW; tmp.height = state.imageH;
        tmp.getContext('2d').drawImage(img, 0, 0, state.imageW, state.imageH);
        state.dominant = extractDominantColors(tmp, 5);
        // Clear any previous brush strokes — new image = fresh start
        _hasPersistentContent = false;
        _persistentMask.width = 0;
        // Detect walls — runs in 50-150ms typically
        try {
          state.wallMask = detectWallMask(tmp);
        } catch (err) {
          state.wallMask = null;
        }
        // For uploaded photos, default to paint mode with the auto-detected
        // wall area pre-painted as the starting point. Architects can then
        // refine with the brush (add areas) or eraser (remove bleed onto
        // furniture, bedding, etc). This is much more reliable for cluttered
        // interiors than relying on the heuristic alone.
        state.appMode = 'mask';
        state.wallOnly = false;  // mask-mode handles the masking, not destination-in
        state.seedMask = state.wallMask;  // tells render to seed the canvas
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function loadSubstrate(type) {
    var w = 1500, h = 1000;
    var c = generateSubstrate(type, w, h);
    var img = new Image();
    img.onload = function() {
      state.image = img;
      state.imageW = w;
      state.imageH = h;
      state.sliderPos = 50;
      state.dominant = extractDominantColors(c, 5);
      // Substrates are pre-rendered walls so no masking needed
      state.wallMask = null;
      state.wallOnly = false;
      render();
    };
    img.src = c.toDataURL('image/png');
  }

  // Saved colours helpers
  function isSaved(hex) {
    if (!hex) return false;
    var h = hex.toLowerCase();
    for (var i = 0; i < state.saved.length; i++) {
      if (state.saved[i].hex.toLowerCase() === h) return true;
    }
    return false;
  }
  function toggleSaved(hex) {
    var h = hex.toLowerCase();
    var existed = isSaved(h);
    if (existed) {
      state.saved = state.saved.filter(function(s) { return s.hex.toLowerCase() !== h; });
    } else {
      // Most-recently-saved first; cap at 30
      var match = findKeim(h);
      state.saved.unshift({hex: h, label: match ? 'KEIM ' + match.n : null});
      if (state.saved.length > 30) state.saved = state.saved.slice(0, 30);
    }
    persistSaved();
    render();
  }

  function selectColor(hex) {
    state.color = hex.toLowerCase();
    paintImage();

    // Check if this colour is a KEIM colour that's NOT currently in the strip.
    // If so, do a full re-render so it gets injected (and auto-scrolled to).
    var match = findKeim(state.color);
    if (match && refs.swatches) {
      var inStrip = false;
      for (var i = 0; i < refs.swatches.length; i++) {
        if (refs.swatches[i].hex.toLowerCase() === state.color) { inStrip = true; break; }
      }
      if (!inStrip) { render(); return; }
    }

    // Update the colour bar live
    if (refs.cbSwatch) refs.cbSwatch.style.backgroundColor = state.color;
    if (refs.cbName) refs.cbName.textContent = match ? 'KEIM ' + match.n : 'Custom colour';
    if (refs.cbSub) refs.cbSub.textContent = dilutionLabel() + ' dilution · Concretal-Lasur';

    // Update strip swatches live
    if (refs.swatches) {
      var activeSwatch = null;
      refs.swatches.forEach(function(s) {
        // swatches show pure KEIM hex, no re-tint needed
        var isActive = s.hex.toLowerCase() === state.color;
        s.el.classList.toggle('active', isActive);
        if (isActive) activeSwatch = s.el;
      });
      if (activeSwatch && activeSwatch.scrollIntoView) {
        try { activeSwatch.scrollIntoView({behavior:'smooth', block:'nearest', inline:'nearest'}); }
        catch (err) { activeSwatch.scrollIntoView(); }
      }
    }
    // Update strip meta label
    if (refs.stripMeta) {
      refs.stripMeta.innerHTML = (match ? 'KEIM ' + match.n : 'Custom colour')
        + '<span class="pct">· ' + dilutionLabel() + '</span>';
    }
    if (refs.treatedLabel) {
      refs.treatedLabel.innerHTML = '<span class="swatch-dot" style="background:' + state.color + '"></span><span class="badge-text">'
        + (match ? 'KEIM ' + match.n : 'Custom') + ' · ' + dilutionLabel() + '</span>';
    }
  }

  function updateLiveAfterDilutionChange() {
    if (refs.ratioChip) refs.ratioChip.textContent = dilutionLabel();
    if (refs.cbSub) refs.cbSub.textContent = dilutionLabel() + ' dilution · Concretal-Lasur';
    if (refs.maskCanvas && state.appMode === 'full') {
      var mctx = refs.maskCanvas.getContext('2d');
      mctx.globalCompositeOperation = 'source-over';
      mctx.clearRect(0, 0, refs.maskCanvas.width, refs.maskCanvas.height);
      mctx.fillStyle = dilutionValue() >= 100 ? state.color : lasurFillColor(state.color, dilutionValue());
      mctx.fillRect(0, 0, refs.maskCanvas.width, refs.maskCanvas.height);
      refs.maskCanvas.style.opacity = '1';
      refs.maskCanvas.style.mixBlendMode = dilutionValue() >= 100 ? 'normal' : 'multiply';
      applySliderClip();
    }
    if (refs.stripMeta) {
      var match = findKeim(state.color);
      refs.stripMeta.innerHTML = (match ? 'KEIM ' + match.n : 'Custom colour')
        + '<span class="pct">· ' + dilutionLabel() + '</span>';
    }
    if (refs.treatedLabel) {
      var m2 = findKeim(state.color);
      refs.treatedLabel.innerHTML = '<span class="swatch-dot" style="background:' + state.color + '"></span><span class="badge-text">'
        + (m2 ? 'KEIM ' + m2.n : 'Custom') + ' · ' + dilutionLabel() + '</span>';
    }
    updateMixerVisual();
  }

  function paintImage() {
    if (!state.image || !refs.imgCanvas || !refs.maskCanvas) return;
    var ic = refs.imgCanvas, mc = refs.maskCanvas;
    // IMPORTANT: only set .width/.height when dimensions have actually changed.
    // Assigning to canvas.width/height always clears the canvas — even if the
    // value is the same — so doing it on every render wipes brush/roller strokes.
    if (ic.width !== state.imageW || ic.height !== state.imageH) {
      ic.width = state.imageW;
      ic.height = state.imageH;
    }
    if (mc.width !== state.imageW || mc.height !== state.imageH) {
      mc.width = state.imageW;
      mc.height = state.imageH;
    }
    var ictx = ic.getContext('2d');
    ictx.drawImage(state.image, 0, 0, state.imageW, state.imageH);

    var mctx = mc.getContext('2d');
    if (state.appMode === 'full') {
      // handled below in blend section
    } else if (state.seedMask) {
      // First time entering mask mode after an image upload — seed the
      // brush canvas with the auto-detected wall area as a starting point.
      mctx.globalCompositeOperation = 'source-over';
      mctx.clearRect(0, 0, mc.width, mc.height);
      mctx.drawImage(state.seedMask, 0, 0, mc.width, mc.height);
      mctx.globalCompositeOperation = 'source-in';
      mctx.fillStyle = state.color;
      mctx.fillRect(0, 0, mc.width, mc.height);
      mctx.globalCompositeOperation = 'source-over';
      state.seedMask = null;
    } else if (_hasPersistentContent) {
      // Persistent strokes exist — restoreMaskContent() will put them back
      // after this call returns. Don't touch the canvas here.
      mctx.clearRect(0, 0, mc.width, mc.height);
    } else {
      // Mask mode with no prior strokes — canvas starts empty, user paints
      mctx.clearRect(0, 0, mc.width, mc.height);
    }
    // Apply CSS opacity & blend mode.
    // In full mode: CSS opacity controls the overall dilution since we fill
    // the entire canvas with one flat colour.
    // In mask mode: opacity is baked into each stroke's globalAlpha so we
    // never override it here — doing so would uniformly dim ALL colours to
    // the same level, preventing multiple colours at different dilutions.
    if (state.appMode === 'full') {
      mctx.globalCompositeOperation = 'source-over';
      mctx.clearRect(0, 0, mc.width, mc.height);
      if (_hasPersistentContent
          && _persistentMask.width === mc.width
          && _persistentMask.height === mc.height) {
        // User has painted strokes — show those instead of flat fill
        mctx.drawImage(_persistentMask, 0, 0);
        mc.style.opacity = '1';
        mc.style.mixBlendMode = 'source-over'; // strokes already have colour baked in
        // Use multiply so the baked strokes interact with substrate naturally
        mc.style.mixBlendMode = 'multiply';
      } else {
        // No strokes — flat fill using lasur colour model
        mctx.fillStyle = dilutionValue() >= 100 ? state.color : lasurFillColor(state.color, dilutionValue());
        mctx.fillRect(0, 0, mc.width, mc.height);
        if (state.wallOnly && state.wallMask) {
          mctx.globalCompositeOperation = 'destination-in';
          mctx.drawImage(state.wallMask, 0, 0, mc.width, mc.height);
          mctx.globalCompositeOperation = 'source-over';
        }
        mc.style.opacity = '1';
        mc.style.mixBlendMode = dilutionValue() >= 100 ? 'normal' : 'multiply';
      }
    } else {
      mc.style.opacity = '1';
      // In mask mode strokes have dilution baked in. At 1:0 use normal so
      // full-strength strokes render solid with no substrate showing through.
      mc.style.mixBlendMode = dilutionValue() >= 100 ? 'normal' : 'multiply';
    }
    applySliderClip();
  }

  function clearMask() {
    if (!refs.maskCanvas) return;
    var ctx = refs.maskCanvas.getContext('2d');
    ctx.clearRect(0, 0, refs.maskCanvas.width, refs.maskCanvas.height);
    _hasPersistentContent = false;
  }

  function applySliderClip() {
    if (!refs.maskCanvas) return;
    if (state.viewMode === 'slider') {
      refs.maskCanvas.style.clipPath = state.sliderOrientation === 'horizontal'
        ? 'inset(' + state.sliderPos + '% 0 0 0)'
        : 'inset(0 0 0 ' + state.sliderPos + '%)';
    } else {
      refs.maskCanvas.style.clipPath = 'none';
    }
  }

  // Correctly size the stage so the image never stretches.
  // Object-fit: contain logic — picks the largest size that fits within the
  // vis-area in both dimensions while maintaining the exact image aspect ratio.
  function updateStageSize() {
    if (!refs.stage || !state.image) return;
    var vis = refs.stage.closest('.vis-area');
    if (!vis) return;
    var pad = 24; // 12px padding each side
    var availW = vis.clientWidth - pad;
    var availH = vis.clientHeight - pad;
    if (availW <= 0 || availH <= 0) return;
    var ar = state.imageW / state.imageH;
    var stageW, stageH;
    if (availW / availH > ar) {
      // Container is wider relative to content — height is the binding constraint
      stageH = availH;
      stageW = Math.round(stageH * ar);
    } else {
      // Container is taller relative to content — width is the binding constraint
      stageW = availW;
      stageH = Math.round(stageW / ar);
    }
    refs.stage.style.width = stageW + 'px';
    refs.stage.style.height = stageH + 'px';
  }

  function updateSliderUI() {
    if (!refs.divider || !refs.handle) return;
    var isH = state.sliderOrientation === 'horizontal';
    if (isH) {
      refs.divider.style.top = state.sliderPos + '%';
      refs.handle.style.left = '50%';
      refs.handle.style.top = state.sliderPos + '%';
    } else {
      refs.divider.style.left = state.sliderPos + '%';
      refs.handle.style.left = state.sliderPos + '%';
      refs.handle.style.top = '50%';
    }
    if (refs.origLabel) refs.origLabel.style.opacity = state.sliderPos > 8 ? 1 : 0;
    if (refs.treatedLabel) refs.treatedLabel.style.opacity = state.sliderPos < 92 ? 1 : 0;
    applySliderClip();
  }

  function downloadResult() {
    if (!state.image) {
      alert('No image loaded — pick a wall first.');
      return;
    }
    try {
      var out = document.createElement('canvas');
      out.width = state.imageW;
      out.height = state.imageH;
      var ctx = out.getContext('2d');

      // Step 1: draw the substrate image
      ctx.drawImage(state.image, 0, 0, state.imageW, state.imageH);

      // Step 2: composite the colour layer using the same logic as on screen
      var dv = dilutionValue();

      if (_hasPersistentContent
          && _persistentMask.width === state.imageW
          && _persistentMask.height === state.imageH) {
        // User has painted brush/roller strokes — composite the persistent
        // mask with multiply blend so substrate texture shows through
        ctx.globalCompositeOperation = 'multiply';
        ctx.drawImage(_persistentMask, 0, 0);
      } else {
        // Flat fill — use lasurFillColor + multiply (or normal at 1:0)
        var fillCanvas = document.createElement('canvas');
        fillCanvas.width = state.imageW;
        fillCanvas.height = state.imageH;
        var fctx = fillCanvas.getContext('2d');
        fctx.fillStyle = dv >= 100 ? state.color : lasurFillColor(state.color, dv);
        fctx.fillRect(0, 0, state.imageW, state.imageH);

        if (state.wallOnly && state.wallMask) {
          fctx.globalCompositeOperation = 'destination-in';
          fctx.drawImage(state.wallMask, 0, 0, state.imageW, state.imageH);
        }

        ctx.globalCompositeOperation = dv >= 100 ? 'source-over' : 'multiply';
        ctx.drawImage(fillCanvas, 0, 0);
      }

      ctx.globalCompositeOperation = 'source-over';

      // Step 3: build filename and trigger download
      var match = findKeim(state.color);
      var tag = match ? 'keim-' + match.n : 'keim-custom-' + state.color.replace('#','');
      var filename = tag + '-' + dilutionLabel().replace(':','x') + '.png';

      out.toBlob(function(blob) {
        if (!blob) { alert('Download failed — please try again.'); return; }
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.download = filename;
        link.href = url;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        // Free the blob URL after a tick
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      }, 'image/png');
    } catch (err) {
      console.error('Save failed:', err);
      alert('Could not save the image. The wall may be too large for your browser to export.');
    }
  }

  function resetToLanding() {
    state.image = null;
    state.imageW = 0; state.imageH = 0;
    state.appMode = 'full';
    state.sliderPos = 50;
    state.dominant = [];
    state.samples = [];
    state.sampling = false;
    state.wallMask = null;
    state.wallOnly = false;
    state.seedMask = null;
    state.paintHintShown = false;
    _hasPersistentContent = false;
    _persistentMask.width = 0;
    refs = {};
    render();
  }

  // ---------------- POINTER (paint) ----------------
  function getCanvasPos(e) {
    var canvas = refs.maskCanvas;
    var rect = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return {
      x: ((t.clientX - rect.left) / rect.width) * canvas.width,
      y: ((t.clientY - rect.top) / rect.height) * canvas.height
    };
  }
  function onPointerDown(e) {
    // Standalone sampling mode (FAB-driven) — works regardless of paint mode
    if (state.sampling && refs.maskCanvas) {
      e.preventDefault();
      sampleAt(getCanvasPos(e));
      state.sampling = false;
      render();
      return;
    }
    if (state.appMode !== 'mask' || !refs.maskCanvas) return;
    e.preventDefault();
    var pos = getCanvasPos(e);
    if (state.tool === 'eyedropper') {
      sampleAt(pos);
      render();
      return;
    }
    isDrawing = true;
    lastPos = pos;
    drawSegment(pos, pos);
  }

  // Sample the underlying image at the given canvas-space position
  function sampleAt(pos) {
    if (!refs.imgCanvas) return;
    var x = Math.max(0, Math.min(refs.imgCanvas.width - 1, Math.floor(pos.x)));
    var y = Math.max(0, Math.min(refs.imgCanvas.height - 1, Math.floor(pos.y)));
    var px = refs.imgCanvas.getContext('2d').getImageData(x, y, 1, 1).data;
    var sampledHex = '#' + [px[0], px[1], px[2]].map(function(v) {
      var s = v.toString(16); return s.length === 1 ? '0' + s : s;
    }).join('');
    var matches = nearestKeimList(sampledHex, 4);
    // Push to history — newest first, deduped
    state.samples = state.samples.filter(function(s) { return s.hex !== sampledHex; });
    state.samples.unshift({hex: sampledHex, matches: matches});
    if (state.samples.length > 6) state.samples = state.samples.slice(0, 6);
    state.tool = 'brush';
    // Auto-apply the closest KEIM match immediately
    if (matches && matches.length > 0) {
      selectColor(matches[0].h);
    }
  }
  function onPointerMove(e) {
    if (!isDrawing || state.appMode !== 'mask') return;
    e.preventDefault();
    var pos = getCanvasPos(e);
    drawSegment(lastPos, pos);
    lastPos = pos;
  }
  function onPointerUp() { isDrawing = false; lastPos = null; }
  function drawSegment(a, b) {
    if (!refs.maskCanvas) return;
    var ctx = refs.maskCanvas.getContext('2d');
    var rect = refs.maskCanvas.getBoundingClientRect();
    var scale = refs.maskCanvas.width / rect.width;
    ctx.save();

    if (state.tool === 'eraser') {
      // Eraser — round, removes paint
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
      ctx.lineWidth = state.brushSize * scale;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();

    } else if (state.tool === 'roller') {
      // Roller — flat square cap, even coverage, hard flat edges.
      // Distinctly different from brush: no round ends, wider, uniform coverage.
      var rw = state.brushSize * scale * 2.0;
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = Math.min(1, 0.92 * (dilutionValue() / 100));
      ctx.strokeStyle = state.color;
      ctx.lineWidth = rw;
      ctx.lineCap = 'butt';
      ctx.lineJoin = 'miter';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();

    } else {
      // Brush — round cap with visible bristle marks.
      // A real brush leaves parallel streaks from individual bristles.
      // We simulate this by drawing the main stroke plus several thin
      // offset strokes at reduced opacity, spread perpendicular to direction.
      ctx.globalCompositeOperation = 'source-over';
      var brushAlpha = Math.max(0.05, DILUTIONS[state.brushOpacityIdx].value / 100)
                     * (dilutionValue() / 100);  // dilution baked in per stroke
      var brushW = state.brushSize * scale;

      // Compute perpendicular direction for bristle spread
      var dx = b.x - a.x, dy = b.y - a.y;
      var len = Math.sqrt(dx*dx + dy*dy) || 1;
      var nx = -dy/len, ny = dx/len;  // perpendicular unit vector

      // Number of bristles scales with brush size — bigger brush = more bristles
      var bristleCount = Math.max(4, Math.min(14, Math.floor(brushW / (scale * 3))));
      var spread = brushW * 0.5;

      for (var b2 = 0; b2 < bristleCount; b2++) {
        // Space bristles evenly across the brush width with slight randomness
        var t = (b2 / (bristleCount - 1)) - 0.5;  // -0.5 to +0.5
        var offset = t * spread + (Math.random() - 0.5) * scale * 1.5;
        // Outer bristles are thinner and more transparent (pressure falls off)
        var edgeFade = 1 - Math.abs(t) * 0.65;
        var bristleAlpha = brushAlpha * edgeFade * (0.7 + Math.random() * 0.3);
        var bristleW = Math.max(scale * 0.8, brushW / bristleCount * (0.8 + Math.random() * 0.4));

        ctx.globalAlpha = Math.min(1, bristleAlpha);
        ctx.strokeStyle = state.color;
        ctx.lineWidth = bristleW;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(a.x + nx*offset, a.y + ny*offset);
        ctx.lineTo(b.x + nx*offset, b.y + ny*offset);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ---------------- POINTER (slider) ----------------
  function onSliderDown(e) {
    if (e.cancelable) e.preventDefault();
    isDraggingSlider = true;
    moveSlider(e);
    window.addEventListener('mousemove', moveSlider);
    window.addEventListener('touchmove', moveSlider, {passive:false});
    window.addEventListener('mouseup', endSlider);
    window.addEventListener('touchend', endSlider);
  }
  function moveSlider(e) {
    if (!isDraggingSlider || !refs.stage) return;
    if (e.cancelable) e.preventDefault();
    var rect = refs.stage.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    var isH = state.sliderOrientation === 'horizontal';
    var c = isH ? t.clientY : t.clientX;
    var start = isH ? rect.top : rect.left;
    var size = isH ? rect.height : rect.width;
    var pct = Math.max(0, Math.min(100, ((c - start) / size) * 100));
    state.sliderPos = pct;
    updateSliderUI();
  }
  function endSlider() {
    isDraggingSlider = false;
    window.removeEventListener('mousemove', moveSlider);
    window.removeEventListener('touchmove', moveSlider);
    window.removeEventListener('mouseup', endSlider);
    window.removeEventListener('touchend', endSlider);
  }

  // ---------------- BOOT ----------------
  document.addEventListener('DOMContentLoaded', render);
  if (document.readyState !== 'loading') render();

  // Re-size the stage when the window is resized (no full re-render needed)
  var _resizeTimer = null;
  window.addEventListener('resize', function() {
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(function() {
      updateStageSize();
      if (state.viewMode === 'slider') updateSliderUI();
    }, 60);
  });
})();
</script>
</body>
</html>
