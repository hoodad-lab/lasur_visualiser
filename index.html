<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>KEIM Concretal-Lasur · Colour Visualiser</title>
<meta name="description" content="Visualise KEIM Concretal-Lasur colours on concrete, brick and rendered surfaces. Adjust strength, compare before/after, paint specific areas." />
<style>
  :root {
    --bg: #0c0a09;
    --bg-2: #1c1917;
    --bg-3: #292524;
    --line: #44403c;
    --text: #f5f5f4;
    --text-2: #a8a29e;
    --text-3: #78716c;
    --accent: #f59e0b;
    --accent-2: #fbbf24;
    --accent-text: #0c0a09;
    --keim: #cf2e2e;
    --keim-2: #8e1a1a;
    --concrete: #c3bcaf;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  html, body, #app { height: 100%; }
  button { font-family: inherit; cursor: pointer; border: 0; }
  input { font-family: inherit; }

  /* Layout */
  #app { display: flex; flex-direction: column; }
  header.topbar {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 8px;
    background: linear-gradient(135deg, var(--keim), var(--keim-2));
    color: #fff; font-weight: 800; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-title { font-size: 15px; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; }
  .brand-sub { font-size: 10px; color: var(--text-2); letter-spacing: 0.04em; }
  .top-actions { display: flex; gap: 6px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 8px;
    font-size: 12px; font-weight: 500;
    background: var(--bg-3); color: var(--text);
    border: 1px solid var(--line);
    transition: background .15s;
  }
  .btn:hover { background: #3f3a37; }
  .btn-primary {
    background: var(--accent); color: var(--accent-text);
    border-color: var(--accent); font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent-2); }
  .btn .lbl { white-space: nowrap; }
  @media (max-width: 480px) {
    .btn .lbl { display: none; }
    .brand-sub { display: none; }
  }

  /* Landing — substrate picker */
  main.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .landing { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }
  .landing-inner { width: 100%; max-width: 880px; }
  .landing h2 { text-align: center; font-size: clamp(22px, 4vw, 32px); font-weight: 600; letter-spacing: -0.02em; margin: 0 0 24px; }
  .substrate-grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(2, 1fr);
  }
  @media (min-width: 720px) { .substrate-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 1100px) { .substrate-grid { grid-template-columns: repeat(6, 1fr); } }
  .tile {
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; text-align: left;
    color: var(--text); padding: 0; transition: border-color .15s, transform .15s;
    display: block; width: 100%;
  }
  .tile:hover { border-color: rgba(245,158,11,0.6); }
  .tile-canvas { width: 100%; aspect-ratio: 3/2; display: block; }
  .tile-body { padding: 10px 12px; }
  .tile-label { font-weight: 600; font-size: 14px; }
  .tile-sub { font-size: 11px; color: var(--text-2); }
  .tile-upload {
    border: 2px dashed var(--line);
    background: var(--bg-2);
    cursor: pointer;
  }
  .tile-upload.drag { border-color: var(--accent); background: rgba(245,158,11,0.06); }
  .tile-upload-inner {
    aspect-ratio: 3/2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-3); padding: 12px;
  }
  .tile-upload-inner small { font-size: 11px; color: var(--text-2); margin-top: 8px; text-align: center; }

  /* Visualiser stage */
  .vis-area { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; background: var(--bg-2); overflow: hidden; }
  .stage-wrap {
    position: relative;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    max-width: 100%;
    max-height: 100%;
  }
  .stage-wrap canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage-wrap canvas.image { z-index: 1; }
  .stage-wrap canvas.mask { z-index: 2; transition: opacity 200ms ease; }

  /* Slider divider */
  .divider {
    position: absolute; pointer-events: none; z-index: 5;
    box-shadow: 0 0 14px rgba(0,0,0,0.55), 0 0 4px rgba(0,0,0,0.85);
  }
  .divider.h {
    left: 0; right: 0; height: 2px; transform: translateY(-50%);
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 6%, #fff 14%, #fff 86%, rgba(255,255,255,0.4) 94%, transparent 100%);
  }
  .divider.v {
    top: 0; bottom: 0; width: 2px; transform: translateX(-50%);
    background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.4) 6%, #fff 14%, #fff 86%, rgba(255,255,255,0.4) 94%, transparent 100%);
  }
  .handle {
    position: absolute; z-index: 6;
    width: 48px; height: 48px; border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 24px rgba(0,0,0,0.55), 0 0 0 4px rgba(255,255,255,0.18);
    transform: translate(-50%, -50%);
    transition: transform .15s;
    color: #292524;
  }
  .handle:hover { transform: translate(-50%, -50%) scale(1.1); }
  .handle:active { transform: translate(-50%, -50%) scale(0.95); }
  .handle.h { cursor: row-resize; }
  .handle.v { cursor: col-resize; }
  .drag-layer { position: absolute; inset: 0; z-index: 4; }
  .drag-layer.h { cursor: row-resize; }
  .drag-layer.v { cursor: col-resize; }

  /* Stage labels */
  .stage-label {
    position: absolute; z-index: 5; pointer-events: none;
    padding: 5px 11px; border-radius: 999px;
    font-size: 10px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.13em;
    transition: opacity 200ms;
  }
  .stage-label.original {
    top: 12px; left: 12px;
    background: rgba(0,0,0,0.7); color: #fff;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .stage-label.treated {
    background: var(--accent); color: var(--accent-text); font-weight: 700;
    display: flex; align-items: center; gap: 5px;
    max-width: calc(100% - 24px);
    overflow: hidden;
  }
  .stage-label.treated .badge-text {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .stage-label.treated.bottom-right { bottom: 12px; right: 12px; }
  .stage-label.treated.top-right { top: 12px; right: 12px; }
  .swatch-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* On-canvas tool pill selector — appears when in paint mode */
  .fab-tools {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .fab-tool {
    display: flex; align-items: center; gap: 7px;
    padding: 0 14px 0 10px;
    height: 38px; border-radius: 999px;
    background: rgba(28,25,23,0.88);
    border: 1px solid rgba(255,255,255,0.14);
    color: rgba(255,255,255,0.75);
    font-size: 12px; font-weight: 600;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 3px 12px rgba(0,0,0,0.45);
    transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
  }
  .fab-tool:hover {
    background: rgba(50,46,42,0.95);
    color: #fff;
    border-color: rgba(255,255,255,0.25);
  }
  .fab-tool.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
    box-shadow: 0 3px 12px rgba(245,158,11,0.4);
  }
  .fab-tool-done {
    margin-top: 3px;
    border-color: rgba(245,158,11,0.4);
    color: var(--accent);
  }
  .fab-tool-done:hover {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .fab-tool-clear {
    color: rgba(255,100,100,0.8);
    border-color: rgba(255,100,100,0.25);
  }
  .fab-tool-clear:hover {
    background: rgba(220,60,60,0.85);
    color: #fff;
    border-color: rgba(220,60,60,0.8);
  }

  .fab-stack {
    position: absolute; bottom: 12px; left: 12px; z-index: 7;
    display: flex; flex-direction: column; gap: 8px;
  }
  .fab {
    width: 44px; height: 44px; border-radius: 50%;
    background: #fff; color: #292524;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    transition: transform .15s, background .15s, color .15s;
  }
  .fab:hover { transform: scale(1.08); }
  .fab:active { transform: scale(0.94); }
  .fab.active {
    background: var(--accent); color: var(--accent-text);
  }
  /* Pulse hint shown briefly while sampling */
  .fab.sampling {
    background: var(--accent); color: var(--accent-text);
    animation: fab-pulse 1.4s ease-in-out infinite;
  }
  @keyframes fab-pulse {
    0%, 100% { box-shadow: 0 4px 16px rgba(0,0,0,0.4), 0 0 0 0 rgba(245,158,11,0.5); }
    50%      { box-shadow: 0 4px 16px rgba(0,0,0,0.4), 0 0 0 10px rgba(245,158,11,0); }
  }
  /* Hint label that fades up when sampling mode is active */
  .sampling-hint {
    position: absolute;
    top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 7;
    padding: 8px 14px;
    background: var(--accent); color: var(--accent-text);
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.12em;
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    animation: hint-in 220ms ease;
    pointer-events: none;
  }
  @keyframes hint-in {
    from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  /* Paint-mode discovery hint — shown once after auto-detection */
  .paint-hint {
    position: absolute;
    top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 7;
    padding: 8px 14px;
    background: rgba(28, 25, 23, 0.94);
    color: var(--text);
    font-size: 11px; font-weight: 500;
    border-radius: 999px;
    border: 1px solid rgba(245,158,11,0.4);
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    animation: hint-in 220ms ease;
    pointer-events: none;
    transition: opacity 400ms ease;
    max-width: calc(100% - 24px);
    text-align: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  /* Sampling loupe — magnifier circle that follows the cursor */
  .loupe {
    position: absolute;
    width: 120px; height: 120px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 8;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5),
                0 0 0 3px rgba(255,255,255,0.95),
                0 0 0 4px rgba(0,0,0,0.4);
    overflow: hidden;
    background: #000;
    transform: translate(-50%, calc(-100% - 16px));
    transition: opacity 120ms;
  }
  .loupe canvas {
    display: block;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  /* Crosshair inside the loupe pointing at the sampled pixel */
  .loupe::before, .loupe::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 0 2px rgba(0,0,0,0.8);
    z-index: 1;
    pointer-events: none;
  }
  .loupe::before {
    left: 50%; top: 50%;
    width: 1px; height: 12px;
    transform: translate(-50%, -50%);
  }
  .loupe::after {
    left: 50%; top: 50%;
    width: 12px; height: 1px;
    transform: translate(-50%, -50%);
  }
  /* Centre square highlighting the exact pixel being read */
  .loupe-pixel {
    position: absolute;
    left: 50%; top: 50%;
    width: 9px; height: 9px;
    border: 1.5px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 2;
  }
  /* Live hex readout under the loupe */
  .loupe-hex {
    position: absolute;
    left: 50%; bottom: -28px;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: #fff;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
  }

  /* ─── Bottom bar ──────────────────────────────────────── */
  .bottom-bar {
    flex-shrink: 0;
    background: var(--bg);
    border-top: 1px solid var(--line);
    display: flex; flex-direction: column;
  }

  /* 1. Controls row — strength slider (full) or paint tools (mask) */
  .controls-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid #22201e;
    min-height: 92px;
  }
  .strength-label { font-size: 10px; color: var(--text-3); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; flex-shrink: 0; }
  @media (max-width: 480px) { .strength-label { display: none; } }
  input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none;
    background: transparent; height: 24px; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, rgba(245,158,11,0.3) 0%, var(--bg-3) 100%);
  }
  input[type=range]::-moz-range-track {
    height: 4px; border-radius: 4px; background: var(--bg-3);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    height: 20px; width: 20px; border-radius: 50%;
    background: var(--accent);
    margin-top: -8px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5), 0 0 0 3px rgba(245,158,11,0.2);
  }
  input[type=range]::-moz-range-thumb {
    height: 20px; width: 20px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .ratio-chip {
    flex-shrink: 0; min-width: 44px;
    padding: 5px 10px; border-radius: 999px;
    background: var(--bg-3); color: var(--accent);
    font-size: 12px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: center; letter-spacing: 0.02em;
    border: 1px solid rgba(245,158,11,0.3);
  }

  /* Mixer visualisation — paint can icons showing pigment + fixative
  /* Mixer visualisation — bucket icons with proportional fills.
     SVG-based: tapered body + arched handle, fill rendered as a clipped
     rect inside the body that grows from the bottom. */
  .mixer {
    display: flex; align-items: flex-start; gap: 8px;
    flex-shrink: 0; height: 80px;
    padding: 0 10px;
  }
  .mixer-col {
    display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    flex-shrink: 0;
  }
  .mixer-caption {
    font-size: 9px;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    line-height: 1;
  }
  .mixer-bucket {
    position: relative;
    width: 48px; height: 56px;
    align-self: center;
    flex-shrink: 0;
  }
  .mixer-bucket svg {
    width: 100%; height: 100%;
    overflow: visible;
  }
  .bucket-fill {
    transition: y 0.18s, height 0.18s, fill 0.18s;
  }
  .mixer-num {
    position: absolute;
    bottom: 6px; left: 0; right: 0;
    text-align: center;
    font-size: 14px;
    font-weight: 800;
    font-family: ui-monospace, monospace;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8),
                 0 0 4px rgba(0,0,0,0.5);
    line-height: 1;
    pointer-events: none;
    z-index: 4;
  }
  .mixer-arrow {
    color: var(--text-3);
    font-size: 18px;
    font-weight: 300;
    margin: 0 2px;
    align-self: flex-start;
    margin-top: 22px;
  }
  .mixer-result {
    width: 44px; height: 44px;
    border-radius: 50%;
    align-self: center;
    background: var(--accent);
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.15),
                inset 0 -3px 6px rgba(0,0,0,0.25),
                0 0 0 2px rgba(255,255,255,0.18),
                0 3px 8px rgba(0,0,0,0.4);
    transition: background 0.18s;
  }
  @media (max-width: 700px) {
    .mixer { display: none; }
  }

  .icon-btn {
    background: transparent; color: var(--text-3);
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--bg-3); color: var(--text); }
  .icon-btn.view-active { color: var(--accent); background: rgba(245,158,11,0.12); }

  /* Paint toolbar (inside controls-row when in mask mode) */
  .tool-group { display: flex; gap: 4px; flex-shrink: 0; }
  .tool {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--bg-3); color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s; flex-shrink: 0;
  }
  .tool:hover { background: #3f3a37; color: var(--text); }
  .tool.active { background: var(--accent); color: var(--accent-text); }
  .paint-sliders { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .paint-slider { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .paint-slider-lbl {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-3); font-weight: 600; width: 38px; flex-shrink: 0;
  }
  .paint-slider input[type=range] { flex: 1; height: 16px; }
  .paint-slider input[type=range]::-webkit-slider-thumb { height: 14px; width: 14px; margin-top: -5px; }
  .paint-slider input[type=range]::-moz-range-thumb { height: 14px; width: 14px; }
  .paint-slider-chip {
    flex-shrink: 0; min-width: 34px; text-align: right;
    font-family: ui-monospace, monospace; font-size: 10px;
    color: var(--accent); font-variant-numeric: tabular-nums;
  }

  /* 2. Colour bar — always visible */
  .colour-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 14px;
    border-bottom: 1px solid #22201e;
    background: var(--bg);
  }
  .cb-swatch {
    width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 4px 14px rgba(0,0,0,0.5);
    position: relative;
  }
  /* Checkerboard behind swatch so transparent custom colours show */
  .cb-swatch::before {
    content: ''; position: absolute; inset: 0; border-radius: 14px;
    background-image:
      linear-gradient(45deg, #555 25%, transparent 25%),
      linear-gradient(-45deg, #555 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #555 75%),
      linear-gradient(-45deg, transparent 75%, #555 75%);
    background-size: 8px 8px;
    background-position: 0 0, 0 4px, 4px -4px, -4px 0;
    opacity: 0.3; border-radius: inherit;
  }
  .cb-swatch-fill {
    position: absolute; inset: 0; border-radius: inherit;
  }
  .cb-info { flex: 1; min-width: 0; }
  .cb-name {
    font-size: 14px; font-weight: 700; color: var(--text);
    letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cb-sub { font-size: 11px; color: var(--text-3); margin-top: 1px; }
  .cb-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .cb-save {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--bg-3); color: var(--text-3);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s, border-color .15s;
  }
  .cb-save:hover { background: #3f3a37; color: var(--text); border-color: rgba(245,158,11,0.4); }
  .cb-save.saved { color: var(--accent); border-color: rgba(245,158,11,0.5); background: rgba(245,158,11,0.08); }
  /* Pick button — always accessible eyedropper */
  .pick-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 0 14px; height: 36px; border-radius: 10px;
    background: var(--bg-3); border: 1px solid var(--line);
    color: var(--text); font-size: 12px; font-weight: 600;
    transition: background .15s, border-color .15s, color .15s;
    flex-shrink: 0; white-space: nowrap;
  }
  .pick-btn:hover { background: #3f3a37; border-color: rgba(245,158,11,0.5); }
  .pick-btn.active {
    background: var(--accent); color: var(--accent-text);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(245,158,11,0.25);
  }
  @media (max-width: 560px) { .pick-btn .pick-lbl { display: none; } }

  /* Sampled results inline row (below colour bar, only when samples exist) */
  .cb-samples {
    background: var(--bg-2);
    border-bottom: 1px solid #22201e;
    padding: 0 14px 10px;
  }
  .cb-samples-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0 6px;
  }
  .cb-samples-title {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em;
    color: var(--accent); font-weight: 700;
    display: flex; align-items: center; gap: 5px;
  }
  .cb-samples-clear {
    background: transparent; color: var(--text-3);
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 3px 8px; border-radius: 5px; transition: background .15s, color .15s;
  }
  .cb-samples-clear:hover { background: var(--bg-3); color: var(--text); }
  .cb-samples-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .cb-samples-scroll::-webkit-scrollbar { height: 0; }
  .cb-sample {
    display: flex; flex-direction: column; gap: 5px;
    flex-shrink: 0; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px;
    transition: border-color .15s;
  }
  .cb-sample:hover { border-color: rgba(245,158,11,0.3); }
  .cb-sample-row { display: flex; align-items: center; gap: 5px; }
  .cb-exact-btn {
    display: flex; align-items: center; gap: 5px;
    background: var(--bg-3); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 6px 3px 3px;
    color: var(--text); flex-shrink: 0;
    transition: border-color .15s;
  }
  .cb-exact-btn:hover { border-color: var(--accent); }
  .cb-exact-btn.active { border-color: var(--accent); background: rgba(245,158,11,0.1); }
  .cb-exact-sw { width: 20px; height: 20px; border-radius: 3px; flex-shrink: 0; }
  .cb-exact-lbl { font-size: 9px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
  .cb-sep { color: var(--text-3); font-size: 11px; flex-shrink: 0; }
  .cb-matches { display: flex; gap: 4px; }
  .cb-match {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 3px 5px; border-radius: 5px;
    background: var(--bg-3); border: 1px solid var(--line);
    color: var(--text); flex-shrink: 0;
    transition: background .15s, border-color .15s;
  }
  .cb-match:hover { background: #3f3a37; border-color: var(--accent); }
  .cb-match.best { border-color: rgba(245,158,11,0.35); }
  .cb-match.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .cb-match-sw { width: 18px; height: 18px; border-radius: 3px; }
  .cb-match-lbl { font-size: 9px; font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  /* 3. Colour strip — vertically scrollable grid */
  .strip-section { }
  .strip-meta {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 14px 4px;
    font-size: 11px; color: var(--text-2); font-weight: 500;
  }
  .strip-meta .pct { color: var(--text-3); margin-left: 4px; }
  .meta-save { display: none; } /* save moved to colour bar */

  /* Saved strip — single horizontal row above the main grid */
  .strip-scroll.saved-scroll {
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 4px 0 6px;
  }
  .strip-scroll.saved-scroll::-webkit-scrollbar { height: 3px; }
  .strip-scroll.saved-scroll::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 2px; }

  /* Main swatch area — vertical scroll grid */
  .strip-scroll {
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 6px 0 10px;
    max-height: 240px;
  }
  .strip-scroll::-webkit-scrollbar { width: 4px; }
  .strip-scroll::-webkit-scrollbar-track { background: transparent; }
  .strip-scroll::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 2px; }

  /* Grid layout for swatches */
  .strip {
    display: flex; flex-wrap: wrap;
    gap: 6px; padding: 4px 12px 8px;
  }
  .saved-strip {
    display: inline-flex; gap: 7px; padding: 0 14px;
    min-width: max-content; align-items: center;
  }
  .saved-head {
    display: flex; align-items: center; gap: 4px;
    color: var(--accent); font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.12em;
    font-weight: 700; padding: 0 4px 0 0; flex-shrink: 0;
  }
  .swatch {
    flex-shrink: 0; width: 56px;
    border-radius: 0;
    box-shadow: none;
    transition: transform .15s;
    cursor: pointer; position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: transparent;
    padding: 2px 0;
  }
  .swatch-colour {
    width: 44px; height: 44px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    transition: box-shadow .15s;
  }
  .swatch-label {
    font-size: 9px;
    font-family: ui-monospace, monospace;
    font-weight: 600;
    color: var(--text-3);
    text-align: center;
    line-height: 1;
    letter-spacing: 0.04em;
    background: transparent;
    white-space: nowrap;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch:active { transform: scale(0.94); }
  .swatch.active .swatch-colour {
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent), 0 4px 14px rgba(0,0,0,0.4);
  }
  .swatch.active .swatch-label { color: var(--accent); }
  .saved-swatch { width: 40px; height: 40px; border-radius: 50%; }
  .saved-swatch.active {
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent), 0 4px 8px rgba(0,0,0,0.4);
  }

  /* Wall/modal toggles */
  .wall-toggle {
    flex-shrink: 0; padding: 4px 10px; border-radius: 999px;
    background: var(--bg-3); color: var(--text-3);
    font-size: 10px; font-weight: 600;
    border: 1px solid var(--line);
    transition: background .15s, color .15s, border-color .15s;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .wall-toggle:hover { background: #3f3a37; color: var(--text); }
  .wall-toggle.on { background: rgba(245,158,11,0.15); color: var(--accent); border-color: rgba(245,158,11,0.5); }

  .modal-bg {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0;
  }
  @media (min-width: 720px) { .modal-bg { align-items: center; padding: 32px; } }
  .modal {
    width: 100%; max-width: 460px;
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 18px 18px 0 0;
    max-height: 85vh; overflow-y: auto;
  }
  @media (min-width: 720px) { .modal { border-radius: 18px; } }
  .modal-head {
    position: sticky; top: 0; background: var(--bg-2);
    border-bottom: 1px solid var(--line);
    padding: 12px 18px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 1;
  }
  .modal-title { font-size: 15px; font-weight: 600; }
  .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 22px; }
  .section h4 {
    margin: 0 0 8px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em;
    color: var(--text-3); font-weight: 600;
  }
  .opt-list { display: flex; flex-direction: column; gap: 4px; }
  .opt {
    text-align: left; padding: 10px 12px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--line);
    color: var(--text); transition: background .15s;
  }
  .opt:hover { background: #2a2725; }
  .opt.active { background: var(--bg-3); border-color: rgba(245,158,11,0.5); }
  .opt-title { font-weight: 500; font-size: 13px; }
  .opt-desc { font-size: 11px; color: var(--text-2); margin-top: 2px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .opt.tile-opt {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10px; padding: 10px 4px;
  }
  .opt.tile-opt svg { color: var(--text-2); }
  .opt.tile-opt.active svg { color: var(--accent); }
  .row { display: flex; gap: 8px; }
  input[type=color] {
    width: 40px; height: 40px; padding: 0; border-radius: 8px;
    border: 1px solid var(--line); background: transparent; cursor: pointer;
  }
  input[type=text], input[type=search] {
    flex: 1; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; color: var(--text);
    padding: 8px 12px; font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  input[type=text]:focus, input[type=search]:focus {
    outline: none; border-color: var(--accent);
  }
  .search-wrap { position: relative; }
  .search-wrap svg {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-3); pointer-events: none;
  }
  .search-wrap input { padding-left: 32px; font-family: inherit; }
  .palette-grid {
    display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px;
    max-height: 180px; overflow-y: auto;
    padding: 6px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .palette-cell {
    aspect-ratio: 1; border-radius: 4px; cursor: pointer;
    transition: transform .12s;
    border: 0;
  }
  .palette-cell:hover { transform: scale(1.15); z-index: 1; }
  .palette-cell.active { box-shadow: 0 0 0 2px var(--bg-2), 0 0 0 4px var(--accent); }

  /* Persistent samples panel — sits above the strength row when samples exist */
  .samples-panel {
    background: var(--bg-2);
    border-bottom: 1px solid var(--line);
    padding: 10px 14px 12px;
    animation: samples-in 220ms ease;
  }
  @keyframes samples-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .samples-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .samples-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em;
    color: var(--accent); font-weight: 700;
  }
  .samples-clear {
    background: transparent; color: var(--text-3);
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 4px 8px; border-radius: 6px; transition: background .15s, color .15s;
  }
  .samples-clear:hover { background: var(--bg-3); color: var(--text); }

  .samples-list {
    display: flex; flex-direction: column; gap: 6px;
    max-height: 30vh;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .samples-list::-webkit-scrollbar { width: 4px; }
  .samples-list::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 2px; }

  .sample-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px;
  }
  .sample-exact {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-3); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px 4px 4px;
    color: var(--text); flex-shrink: 0;
    transition: background .15s, border-color .15s;
  }
  .sample-exact:hover { background: #3f3a37; border-color: var(--accent); }
  .sample-exact.active { border-color: var(--accent); background: rgba(245,158,11,0.1); }
  .sample-exact-sw {
    width: 26px; height: 26px; border-radius: 4px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }
  .sample-exact-info { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
  .sample-exact-lbl {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--accent); font-weight: 700;
  }
  .sample-exact-hex {
    font-size: 11px; font-family: ui-monospace, monospace;
    color: var(--text);
  }

  .sample-arrow {
    color: var(--text-3); font-size: 12px;
    flex-shrink: 0;
  }

  .sample-matches {
    display: flex; gap: 4px; overflow-x: auto;
    flex: 1; min-width: 0;
  }
  .sample-matches::-webkit-scrollbar { height: 0; }
  .sample-match {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 3px 6px; border-radius: 5px;
    background: var(--bg-3); border: 1px solid var(--line);
    color: var(--text); flex-shrink: 0;
    transition: background .15s, border-color .15s;
  }
  .sample-match:hover { background: #3f3a37; border-color: var(--accent); }
  .sample-match.best { border-color: rgba(245,158,11,0.4); }
  .sample-match.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .sample-match-sw {
    width: 20px; height: 20px; border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
  }
  .sample-match-lbl {
    font-size: 9px; font-family: ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* Match-from-image section in the More sheet */
  .match-section-head {
    display: flex; align-items: center; gap: 6px;
    color: var(--accent); margin-bottom: 6px;
  }
  .match-section-head h4 {
    margin: 0;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em;
    color: var(--accent); font-weight: 700;
  }
  .section-hint {
    margin: 0 0 10px;
    font-size: 11px; color: var(--text-2); line-height: 1.4;
  }
  .dom-list { display: flex; flex-direction: column; gap: 6px; }
  .dom-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--line);
  }
  .dom-sample {
    width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
  }
  .dom-arrow { color: var(--text-3); font-size: 14px; flex-shrink: 0; }
  .dom-matches { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  .dom-chip {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 4px 6px; border-radius: 6px;
    background: var(--bg-3); border: 1px solid var(--line);
    color: var(--text); transition: background .15s, border-color .15s;
    min-width: 50px;
  }
  .dom-chip:hover { background: #3f3a37; border-color: var(--accent); }
  .dom-chip.best { border-color: rgba(245,158,11,0.5); }
  .dom-chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .dom-chip-sw {
    width: 22px; height: 22px; border-radius: 4px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
  }
  .dom-chip-lbl {
    font-size: 10px; font-family: ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* Compatibility hint when iframed */
  .ratio-stage { /* dimensions set by updateStageSize() after layout */ }
</style>
</head>

    {id:'concrete_ribbed',   label:'Concrete',        subtitle:'Vertical board-formed'},
    {id:'concrete_polished', label:'Concrete',        subtitle:'Polished / honed'},

  // Ordered to match the official KEIM ratio chart. The "value" is the

  // swatch chart so visual intensity matches expectations on a grey
  // concrete substrate (pure dilution math is too subtle below 1:1).
  // Ratios above 1:1 are inverted (paint-heavier than thinner).

  //   0 = fill with white → no tint at all, substrate unchanged.
  // Multiply blend preserves substrate texture at EVERY value.

  //   pigment_parts / (pigment_parts + fixative_parts) × 100

  // rendering all reflect the SAME physical mix proportion.
  var DILUTIONS = [
    {label:'1:10', value:  9},  // 1 / 11 = 9%
    {label:'1:8',  value: 11},  // 1 / 9
    {label:'1:6',  value: 14},  // 1 / 7
    {label:'1:5',  value: 17},  // 1 / 6
    {label:'1:4',  value: 20},  // 1 / 5
    {label:'1:3',  value: 25},  // 1 / 4
    {label:'1:2',  value: 33},  // 1 / 3
    {label:'2:3',  value: 40},  // 2 / 5
    {label:'1:1',  value: 50},  // 1 / 2 — exact midpoint
    {label:'2:1',  value: 67},  // 2 / 3
    {label:'3:1',  value: 75},  // 3 / 4
    {label:'4:1',  value: 80},  // 4 / 5
    {label:'5:1',  value: 83},  // 5 / 6
    {label:'6:1',  value: 86},  // 6 / 7

  // ---------------- HELPERS ----------------
  function hexToRgb(hex) {
    var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return m ? {r:parseInt(m[1],16), g:parseInt(m[2],16), b:parseInt(m[3],16)} : null;
  }

  // Compute the fill colour for multiply-blend Lasur simulation.
  // At strength=100 (1:0): returns the paint colour exactly.
  // At lower strengths: interpolates toward white (#fff).
  // multiply(white, substrate) = substrate unchanged.
  // multiply(paint, substrate) = substrate tinted by paint.
  // So dragging from 1:10→1:0 goes from "barely tinted" to "fully tinted"
  // while the substrate texture ALWAYS shows through at every ratio.
  function lasurFillColor(hex, strengthPct) {
    var paint = hexToRgb(hex);
    if (!paint) return hex;
    var s = Math.max(0, Math.min(1, strengthPct / 100));
    // Lerp from white (255,255,255) toward paint colour
    var r = Math.round(255 + (paint.r - 255) * s);
    var g = Math.round(255 + (paint.g - 255) * s);
    var b = Math.round(255 + (paint.b - 255) * s);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

    var fg = hexToRgb(hex); if (!fg) return '#c3bcaf';
    var a = Math.max(0, Math.min(1, pct/100));
    var r = Math.round(fg.r*a + CONCRETE_RGB.r*(1-a));
    var g = Math.round(fg.g*a + CONCRETE_RGB.g*(1-a));
    var b = Math.round(fg.b*a + CONCRETE_RGB.b*(1-a));
    return 'rgb('+r+','+g+','+b+')';
  }
  function findKeim(hex) {
    if (!hex) return null;
    hex = hex.toLowerCase();
    for (var i = 0; i < KEIM.length; i++) if (KEIM[i].h.toLowerCase() === hex) return KEIM[i];
    return null;
  }

  // Return the N nearest KEIM Exclusiv colours to a given hex, with distance
  function nearestKeimList(hex, n) {
    var t = hexToRgb(hex);
    if (!t) return [];
    var arr = KEIM.map(function(c) {
      var r = hexToRgb(c.h);
      var d = Math.sqrt((t.r-r.r)*(t.r-r.r) + (t.g-r.g)*(t.g-r.g) + (t.b-r.b)*(t.b-r.b));
      return {n:c.n, h:c.h, d:d};

    arr.sort(function(a,b){ return a.d - b.d; });
    return arr.slice(0, n||3);

  // Extract dominant colours from an image canvas using a lightweight
  // bucket-then-merge approach (close to k-means but deterministic & fast)
  // -----------------------------------------------------------
  // WALL SEGMENTATION (heuristic, runs in browser, ~80% accuracy)
  // -----------------------------------------------------------
  // Scores each pixel for "wall-likeness" using:
  //   1. Saturation (walls are usually low-saturation/desaturated)
  //   2. Lightness   (mid-range — exclude pure black windows & blown-out sky)
  //   3. Local variance — walls are SMOOTH, foliage/textiles/floors are busy
  // Then erodes/dilates to clean up speckle, and box-blurs the boundary.
  // Returns an ImageData where alpha = wall confidence (0–255).
  function detectWallMask(sourceCanvas) {
    var w = sourceCanvas.width, h = sourceCanvas.height;
    // Detection is done at reduced resolution for speed, then upscaled.
    // 400px max keeps it under ~50ms even on a phone.
    var maxSide = 400;
    var scale = Math.min(1, maxSide / Math.max(w, h));
    var sw = Math.max(1, Math.round(w * scale));
    var sh = Math.max(1, Math.round(h * scale));

    // Render the source down to a working canvas
    var work = document.createElement('canvas');
    work.width = sw; work.height = sh;
    var wctx = work.getContext('2d');
    wctx.drawImage(sourceCanvas, 0, 0, sw, sh);
    var data = wctx.getImageData(0, 0, sw, sh).data;

    // Convert to HSL once (storing only S and L for speed)
    var sat = new Uint8Array(sw * sh);
    var lit = new Uint8Array(sw * sh);
    for (var i = 0; i < sw * sh; i++) {
      var r = data[i*4]/255, g = data[i*4+1]/255, b = data[i*4+2]/255;
      var max = Math.max(r,g,b), min = Math.min(r,g,b);
      var l = (max+min)/2;
      var s = 0;
      if (max !== min) {
        var d = max - min;
        s = l > 0.5 ? d/(2-max-min) : d/(max+min);
      }
      sat[i] = Math.round(s * 255);
      lit[i] = Math.round(l * 255);
    }

    // Local lightness variance — sample 8 neighbours (cardinal + diagonal)
    // at radius 4 so even subtle bedding/fabric texture fails the smooth test
    var variance = new Uint8Array(sw * sh);
    var rad = 4;
    for (var y = 0; y < sh; y++) {
      for (var x = 0; x < sw; x++) {
        var idx = y*sw + x;
        var c = lit[idx];
        var sum = 0;
        var ny = y - rad, sy = y + rad, wx = x - rad, ex = x + rad;
        if (ny >= 0)        sum += Math.abs(c - lit[ny*sw + x]);
        if (sy < sh)        sum += Math.abs(c - lit[sy*sw + x]);
        if (wx >= 0)        sum += Math.abs(c - lit[idx - rad]);
        if (ex < sw)        sum += Math.abs(c - lit[idx + rad]);
        if (ny >= 0 && wx >= 0) sum += Math.abs(c - lit[ny*sw + wx]);
        if (ny >= 0 && ex < sw) sum += Math.abs(c - lit[ny*sw + ex]);
        if (sy < sh && wx >= 0) sum += Math.abs(c - lit[sy*sw + wx]);
        if (sy < sh && ex < sw) sum += Math.abs(c - lit[sy*sw + ex]);
        variance[idx] = Math.min(255, sum);
      }
    }

    // Score: high if low-sat + mid-lightness + low-variance + upper-frame
    var score = new Uint8Array(sw * sh);
    for (var py = 0; py < sh; py++) {
      // Vertical bias: walls and ceilings dominate the upper 2/3 of the
      // frame; floors, beds, and rugs dominate the lower third. Apply a
      // gentle penalty as we descend below 60% of the frame height.
      var verticalBias;
      var rel = py / sh;
      if (rel < 0.6) verticalBias = 1;
      else verticalBias = Math.max(0.25, 1 - (rel - 0.6) * 1.5);

      for (var px = 0; px < sw; px++) {
        var idx2 = py*sw + px;
        // Saturation: prefer < 35/255 (~14%); penalise above
        var sScore = sat[idx2] < 35 ? 1 : Math.max(0, 1 - (sat[idx2] - 35) / 90);
        // Lightness: prefer 60–235 (exclude near-black & blown-out)
        var lv = lit[idx2];
        var lScore = (lv >= 60 && lv <= 235)
          ? 1
          : (lv < 60 ? Math.max(0, lv / 60) : Math.max(0, (255 - lv) / 20));
        // Variance: prefer < 18; sharply penalise any texture above that.
        // This is the key change for interior scenes — bedding and rugs
        // accumulate enough variance to fail this check.
        var vScore = variance[idx2] < 18
          ? 1
          : Math.max(0, 1 - (variance[idx2] - 18) / 40);
        var combined = sScore * lScore * vScore * verticalBias;
        score[idx2] = Math.round(combined * 255);
      }
    }

    // Threshold to binary, then morphological cleanup
    var threshold = 130;
    var bin = new Uint8Array(sw * sh);
    for (var i3 = 0; i3 < sw * sh; i3++) bin[i3] = score[i3] > threshold ? 255 : 0;

    // Erode harder to break weak connections between walls and adjacent
    // wall-coloured objects (e.g. bedding next to a wall)
    bin = morph(bin, sw, sh, 'erode', 2);
    bin = morph(bin, sw, sh, 'dilate', 3);
    bin = morph(bin, sw, sh, 'erode', 1);

    // Connected-component analysis — keep only the largest few regions.
    // This is the strongest signal: walls are usually ONE big contiguous
    // blob; bedding, rugs, furniture form smaller disconnected blobs.
    bin = keepLargestComponents(bin, sw, sh, 2, 0.04);

    // Box-blur to feather the boundary so the colour overlay edges aren't jagged
    var feathered = boxBlur(bin, sw, sh, 3);

    // Build the mask as full-resolution ImageData using the source canvas size.
    var maskCanvas = document.createElement('canvas');
    maskCanvas.width = sw; maskCanvas.height = sh;
    var maskCtx = maskCanvas.getContext('2d');
    var maskData = maskCtx.createImageData(sw, sh);
    for (var i4 = 0; i4 < sw * sh; i4++) {
      maskData.data[i4*4]   = 255;
      maskData.data[i4*4+1] = 255;
      maskData.data[i4*4+2] = 255;
      maskData.data[i4*4+3] = feathered[i4];
    }
    maskCtx.putImageData(maskData, 0, 0);

    // Upscale to full source resolution with smoothing for soft edges
    var fullCanvas = document.createElement('canvas');
    fullCanvas.width = w; fullCanvas.height = h;
    var fullCtx = fullCanvas.getContext('2d');
    fullCtx.imageSmoothingEnabled = true;
    fullCtx.imageSmoothingQuality = 'high';
    fullCtx.drawImage(maskCanvas, 0, 0, w, h);
    return fullCanvas;
  }

  // Connected-component labelling (4-connected). Keeps the top N components
  // by pixel count, but only if they exceed minFraction of total pixels.
  // This is what filters out bedding/furniture/rugs while keeping walls.
  function keepLargestComponents(src, w, h, topN, minFraction) {
    var total = w * h;
    var labels = new Int32Array(total);
    var sizes = [0]; // index 0 is background
    var stack = new Int32Array(total);
    var nextLabel = 1;

    for (var i = 0; i < total; i++) {
      if (src[i] !== 255 || labels[i] !== 0) continue;
      // Iterative flood-fill (avoid stack overflow on large blobs)
      var top = 0, count = 0;
      stack[top++] = i;
      labels[i] = nextLabel;
      while (top > 0) {
        var p = stack[--top];
        count++;
        var py = (p / w) | 0;
        var px = p - py * w;

        var sat=opts.satBase+Math.random()*opts.satRange;

        ctx.fillStyle='hsl('+hue+','+sat+'%,'+lit+'%)';
        ctx.fillRect(px+1,y+1,bw-2,bh-2);
        // Gradient shading per brick (light top, dark bottom)
        var grd=ctx.createLinearGradient(0,y,0,y+bh);
        grd.addColorStop(0,'rgba(255,255,255,0.12)');
        grd.addColorStop(0.6,'rgba(0,0,0,0)');
        grd.addColorStop(1,'rgba(0,0,0,0.18)');
        ctx.fillStyle=grd; ctx.fillRect(px+1,y+1,bw-2,bh-2);
        // Mortar recessed shadow
        ctx.fillStyle='rgba(0,0,0,0.12)';
        ctx.fillRect(px,y,bw,1); ctx.fillRect(px,y,1,bh);
        var cx2=Math.max(0,px+1), cy2=Math.max(0,y+1);
        var cw2=Math.min(bw-2,w-cx2), ch2=Math.min(bh-2,h-cy2);
        if (cw2>0&&ch2>0&&cx2+cw2<=w&&cy2+ch2<=h) addNoise(ctx,cx2,cy2,cw2,ch2,20);
      }
      row++;
    }
    return c;
  }

  // Exposed aggregate concrete — realistic river stones packed in cement paste
  function makeConcreteRibbed(w, h) {
    var c = document.createElement('canvas'); c.width=w; c.height=h;
    var ctx = c.getContext('2d');

    // ── Base ── cool grey, slightly uneven across the wall ───────────────
    var base = ctx.createLinearGradient(0, 0, w, h);
    base.addColorStop(0,   '#b6b9bc');
    base.addColorStop(0.5, '#acafb2');
    base.addColorStop(1,   '#a4a7aa');
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);

    // Minimal surface noise — fine concrete grain
    addNoise(ctx, 0, 0, w, h, 6);

    // ── Vertical board-formed panels ─────────────────────────────────────
    // Cast in place with vertical timber boards on edge. Each board leaves
    // its own panel with subtle tonal variation and a recessed joint.
    var numBoards = 5;
    var boardW = w / numBoards;
    var shifts = [5, -7, 8, -5, 4];
    for (var bi = 0; bi < numBoards; bi++) {
      var bx  = Math.round(bi * boardW);
      var bw2 = Math.round((bi + 1) * boardW) - bx;
      var v   = Math.round(180 + shifts[bi]);
      ctx.fillStyle = 'rgba('+v+','+v+','+v+',0.16)';
      ctx.fillRect(bx, 0, bw2, h);

      // Vertical joint: dark recess + slim highlight on the right edge
      if (bi > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.24)';
        ctx.fillRect(bx, 0, 2, h);
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        ctx.fillRect(bx + 2, 0, 1, h);
      }
    }

    // ── Subtle vertical timber grain ─────────────────────────────────────
    // Fine vertical lines suggest the wood-grain imprint of timber boards.
    // Sparse, varied length, subtle alpha — reads as texture not as marks.
    var grainCount = Math.round(w / 8);
    for (var gi = 0; gi < grainCount; gi++) {
      var gx = Math.random() * w;
      var gAlpha = 0.025 + Math.random() * 0.035;
      var dark = Math.random() > 0.55;
      ctx.strokeStyle = dark
        ? 'rgba(0,0,0,'+gAlpha+')'
        : 'rgba(255,255,255,'+(gAlpha*0.7)+')';
      ctx.lineWidth = 0.5 + Math.random() * 0.6;
      ctx.beginPath();
      var sy = Math.random() * h * 0.4;
      var ey = sy + h * 0.3 + Math.random() * h * 0.5;
      // Slight horizontal drift — natural grain isn't perfectly straight
      ctx.moveTo(gx, sy);
      ctx.bezierCurveTo(
        gx + (Math.random()-0.5)*1.5, sy + (ey-sy)*0.33,
        gx + (Math.random()-0.5)*1.5, sy + (ey-sy)*0.66,
        gx + (Math.random()-0.5)*1.5, ey
      );
      ctx.stroke();
    }

    return c;
  }


  // Limestone — authentic cut ashlar blocks, cream/grey/buff with fossil-like texture
  function makeLimestone(w, h) {
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    var ctx=c.getContext('2d');

    // Background — uneven limestone base colour
    var bg = ctx.createLinearGradient(0,0,w,h);
    bg.addColorStop(0,'#d2cabb'); bg.addColorStop(0.5,'#c8bfaa'); bg.addColorStop(1,'#cec5b0');
    ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
    addNoise(ctx,0,0,w,h,20);

    // Block layout — irregular courses like real ashlar
    var courseH = Math.round(h/5.5);
    var y=0;
    while (y < h) {
      var ch = Math.round(courseH*(0.75+Math.random()*0.5));
      var gap = 7+Math.round(Math.random()*4);
      var x=0;
      while (x < w) {
        var bw2 = Math.round((w/4)*(0.6+Math.random()*0.9));
        // Each block has its own colour variation
        var hue=38+Math.random()*10, sat=7+Math.random()*10, lit=60+Math.random()*16;
        var grd = ctx.createLinearGradient(x,y,x+bw2,y+ch);
        grd.addColorStop(0,'hsl('+hue+','+(sat+3)+'%,'+(lit+4)+'%)');
        grd.addColorStop(1,'hsl('+hue+','+sat+'%,'+(lit-5)+'%)');
        ctx.fillStyle=grd;
        ctx.fillRect(x+gap/2,y+gap/2,bw2-gap,ch-gap);

        // Sediment banding — horizontal lines within each block
        var bandCount = 2+Math.floor(Math.random()*5);
        for (var bi=0; bi<bandCount; bi++) {
          var by2 = y+gap/2 + ((ch-gap)/(bandCount+1))*(bi+1) + (Math.random()-0.5)*3;
          ctx.strokeStyle = Math.random()>0.5
            ? 'rgba(0,0,0,'+(0.04+Math.random()*0.07)+')'
            : 'rgba(255,255,255,'+(0.05+Math.random()*0.08)+')';
          ctx.lineWidth = 0.4+Math.random()*0.9;
          ctx.beginPath();
          ctx.moveTo(x+gap/2+Math.random()*10, by2);
          ctx.lineTo(x+bw2-gap-Math.random()*10, by2);
          ctx.stroke();
        }
        // Fossil/shell inclusions (random small ovals)
        if (Math.random()>0.7) {
          var fx=x+gap+Math.random()*(bw2-gap*3), fy=y+gap+Math.random()*(ch-gap*3);
          ctx.strokeStyle='rgba(0,0,0,0.12)';
          ctx.lineWidth=0.8;
          ctx.beginPath();
          ctx.ellipse(fx,fy,4+Math.random()*8,2+Math.random()*4,Math.random()*Math.PI,0,Math.PI*2);
          ctx.stroke();
        }
        // Tool marks — chisel pattern at block edges
        ctx.strokeStyle='rgba(0,0,0,0.18)';
        ctx.lineWidth=1.2;
        ctx.strokeRect(x+gap/2+0.5,y+gap/2+0.5,bw2-gap-1,ch-gap-1);
        // Top highlight (freshly cut face)
        ctx.fillStyle='rgba(255,255,255,0.08)';
        ctx.fillRect(x+gap/2,y+gap/2,bw2-gap,3);
        // Noise per block
        var bx=Math.max(0,x+gap/2), by3=Math.max(0,y+gap/2);
        var bww=Math.min(bw2-gap,w-bx), bhh=Math.min(ch-gap,h-by3);
        if (bww>0&&bhh>0) addNoise(ctx,bx,by3,bww,bhh,14);
        x+=bw2;
      }
      y+=ch;
    }
    // Overall weathering wash
    ctx.fillStyle='rgba(0,0,0,0.04)';
    for (var wi2=0; wi2<6; wi2++) {
      var wx=Math.random()*w, wy=Math.random()*h, wr=40+Math.random()*100;
      var wg=ctx.createRadialGradient(wx,wy,0,wx,wy,wr);
      wg.addColorStop(0,'rgba(0,0,0,0.08)'); wg.addColorStop(1,'transparent');
      ctx.fillStyle=wg; ctx.beginPath(); ctx.arc(wx,wy,wr,0,Math.PI*2); ctx.fill();
    }
    return c;
  }

  // Sandstone — deeply stratified, warm iron-oxide layers, bush-hammered face
  function makeSandstone(w, h) {
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    var ctx=c.getContext('2d');

    // Rich layered base
    var bg=ctx.createLinearGradient(0,0,0,h);
    bg.addColorStop(0,'#c4904a'); bg.addColorStop(0.3,'#b87e3a'); bg.addColorStop(0.7,'#c89050'); bg.addColorStop(1,'#ae7832');
    ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
    addNoise(ctx,0,0,w,h,30);

    // Stratification — wavy horizontal bands across the whole surface
    for (var si=0; si<30; si++) {
      var sy2=Math.random()*h;
      var ironRich=Math.random()>0.55;
      ctx.strokeStyle = ironRich
        ? 'rgba(140,70,20,'+(0.12+Math.random()*0.18)+')'  // iron oxide band
        : 'rgba(220,190,130,'+(0.08+Math.random()*0.12)+')'; // pale silica band
      ctx.lineWidth=0.6+Math.random()*2.5;
      ctx.beginPath();
      ctx.moveTo(0,sy2);
      // Wavy — natural geological undulation
      for (var sx2=0; sx2<w; sx2+=40) {
        ctx.lineTo(sx2, sy2+(Math.random()-0.5)*6);
      }
      ctx.lineTo(w,sy2);
      ctx.stroke();
    }

    // Block courses
    var bh2=Math.round(h/5), gp=8;
    var row2=0;
    for (var y2=0; y2<h; y2+=bh2+gp) {
      var x2=0, off2=(row2%2)*Math.round(w/7);
      x2=-off2;
      while (x2<w) {
        var bwx=Math.round((w/5)*(0.7+Math.random()*0.7));
        // Bush-hammered texture on face — fine pitting
        var blockCtx = ctx;
        var blit=44+Math.random()*18, bsat=30+Math.random()*20;
        var bg2=ctx.createLinearGradient(x2,y2,x2+bwx,y2+bh2);
        bg2.addColorStop(0,'hsl(30,'+bsat+'%,'+(blit+6)+'%)');
        bg2.addColorStop(1,'hsl(28,'+bsat+'%,'+(blit-4)+'%)');
        ctx.fillStyle=bg2;
        ctx.fillRect(x2+gp/2,y2+gp/2,bwx-gp,bh2-gp);

        // Bush-hammered pitting — tiny dark and light dots over the face
        var pitCount=Math.round((bwx-gp)*(bh2-gp)/28);
        for (var pi=0; pi<pitCount; pi++) {
          var px2=x2+gp/2+Math.random()*(bwx-gp);
          var py2=y2+gp/2+Math.random()*(bh2-gp);
          ctx.fillStyle=Math.random()>0.5
            ?'rgba(0,0,0,'+(0.1+Math.random()*0.15)+')'
            :'rgba(255,255,255,'+(0.08+Math.random()*0.1)+')';
          ctx.beginPath(); ctx.arc(px2,py2,0.4+Math.random()*1.2,0,Math.PI*2); ctx.fill();
        }
        // Iron-oxide stain streaks per block
        if (Math.random()>0.5) {
          var stx=x2+gp+Math.random()*(bwx-gp*3);
          var stg=ctx.createLinearGradient(stx,y2+gp/2,stx,y2+bh2-gp);
          stg.addColorStop(0,'transparent');
          stg.addColorStop(0.4,'rgba(140,70,15,'+(0.1+Math.random()*0.14)+')');
          stg.addColorStop(1,'transparent');
          ctx.fillStyle=stg;
          ctx.fillRect(stx,y2+gp/2,2+Math.random()*4,bh2-gp);
        }
        // Joint shadow
        ctx.strokeStyle='rgba(60,40,20,0.25)'; ctx.lineWidth=gp;
        ctx.strokeRect(x2+gp/2,y2+gp/2,bwx-gp,bh2-gp);
        // Top cut edge highlight
        ctx.fillStyle='rgba(255,240,200,0.14)';
        ctx.fillRect(x2+gp/2,y2+gp/2,bwx-gp,2);
        x2+=bwx;
      }
      row2++;
    }
    return c;
  }

  // Old brick — century-old weathered red brick, mortar losses, staining, colour variation
  function makeBrickOld(w, h) {
    var c = document.createElement('canvas'); c.width=w; c.height=h;
    var ctx = c.getContext('2d');

    // ── Mortar base ────────────────────────────────────────────────────────
    // Old mortar is not uniform — lime putty yellows, stains vary, cracks grey
    var mortarBase = ctx.createLinearGradient(0, 0, w, h);
    mortarBase.addColorStop(0,   '#6e6658');
    mortarBase.addColorStop(0.3, '#7a7060');
    mortarBase.addColorStop(0.7, '#68625a');
    mortarBase.addColorStop(1,   '#726858');
    ctx.fillStyle = mortarBase; ctx.fillRect(0, 0, w, h);
    addNoise(ctx, 0, 0, w, h, 30);

    // Large-scale mortar tonal variation — lime-rich patches are paler
    for (var mp = 0; mp < 20; mp++) {
      var mx = Math.random()*w, my = Math.random()*h;
      var mr = 20 + Math.random()*80;
      var mg = ctx.createRadialGradient(mx, my, 0, mx, my, mr);
      mg.addColorStop(0, Math.random() > 0.5
        ? 'rgba(200,190,165,0.12)'   // pale lime-rich mortar
        : 'rgba(20,15,8,0.1)');      // dark stained patch
      mg.addColorStop(1, 'transparent');
      ctx.fillStyle = mg; ctx.fillRect(0, 0, w, h);
    }

    // ── Brick geometry ─────────────────────────────────────────────────────
    // Real old bricks are hand-made and vary in size — not perfectly uniform
    var nomBW = Math.round(w / 9.5);
    var nomBH = Math.round(nomBW * 0.37);
    var gp    = Math.max(6, Math.round(nomBW * 0.075));

    // Extended fired-brick colour palette — pre-industrial kilns had huge variation
    // Ranges: dark vitrified (kiln bottom) → mid red → salmon → buff multi
    var palette = [
      // Vitrified / dark
      {h:4,   s:65, l:18}, {h:8,   s:58, l:20}, {h:2,   s:55, l:16},
      {h:15,  s:48, l:22},
      // Classic red
      {h:8,   s:62, l:26}, {h:12,  s:55, l:30}, {h:6,   s:60, l:28},
      {h:10,  s:50, l:32}, {h:14,  s:45, l:34},
      // Warm mid-red / brown
      {h:18,  s:48, l:30}, {h:20,  s:42, l:33}, {h:16,  s:52, l:28},
      // Salmon / light
      {h:22,  s:38, l:40}, {h:26,  s:32, l:44}, {h:20,  s:35, l:38},
      // Multi-buff / cream flashed
      {h:32,  s:28, l:50}, {h:28,  s:22, l:46},
    ];

    var row = 0;
    for (var y = -nomBH; y < h + nomBH; y += nomBH + gp) {
      // Each row has a slight vertical position jitter — hand-laid imprecision
      var rowY = y + Math.round((Math.random()-0.5)*2);
      // Running bond offset — alternate rows
      var offset = (row % 2) * Math.round((nomBW + gp) / 2);
      var x = -nomBW + offset;

      while (x < w + nomBW) {
        // Each brick has individual size variation ±8% — hand-made bricks
        var bw2 = Math.round(nomBW * (0.92 + Math.random()*0.16));
        var bh2 = Math.round(nomBH * (0.92 + Math.random()*0.12));
        var px  = Math.round(x);
        var py  = Math.round(rowY);

        // Skip invisible bricks fully outside canvas
        if (px + bw2 < 0 || px > w || py + bh2 < 0 || py > h) {
          x += bw2 + gp; continue;
        }

        var pal = palette[Math.floor(Math.random() * palette.length)];
        // Per-brick colour variation within the range
        var hv = pal.h + (Math.random()-0.5) * 10;
        var sv = Math.max(5, pal.s + (Math.random()-0.5) * 16);
        var lv = pal.l + (Math.random()-0.5) * 8;

        // ── Base brick face ──
        ctx.fillStyle = 'hsl('+hv+','+sv+'%,'+lv+'%)';
        ctx.fillRect(px, py, bw2, bh2);

        // ── Kiln firing gradient ──
        // Real bricks fired in a clamp kiln: darker towards the outer edges
        // (more exposed to flame), lighter near centre (more even heat)
        var fg = ctx.createRadialGradient(
          px + bw2*0.5, py + bh2*0.45,  bw2*0.1,
          px + bw2*0.5, py + bh2*0.5,   bw2*1.1
        );
        fg.addColorStop(0,   'rgba(255,255,255,0.06)');
        fg.addColorStop(0.5, 'rgba(0,0,0,0.04)');
        fg.addColorStop(1,   'rgba(0,0,0,0.18)');
        ctx.fillStyle = fg; ctx.fillRect(px, py, bw2, bh2);

        // ── Flash marks ── (dark blotch from flame contact, ~30% of bricks)
        if (Math.random() > 0.70) {
          var fcount = 1 + Math.floor(Math.random()*2);
          for (var fi = 0; fi < fcount; fi++) {
            var fx2 = px + bw2*(0.05 + Math.random()*0.85);
            var fy2 = py + bh2*(0.05 + Math.random()*0.85);
            var fr2 = bw2*(0.15 + Math.random()*0.28);
            var fgrd = ctx.createRadialGradient(fx2, fy2, 0, fx2, fy2, fr2);
            fgrd.addColorStop(0, 'rgba(10,5,2,'+(0.25+Math.random()*0.3)+')');
            fgrd.addColorStop(0.6, 'rgba(20,10,4,'+(0.08+Math.random()*0.12)+')');
            fgrd.addColorStop(1, 'transparent');
            ctx.fillStyle = fgrd; ctx.fillRect(px, py, bw2, bh2);
          }
        }

        // ── Lime bloom / efflorescence ── (white salt crystals, ~20%)
        if (Math.random() > 0.80) {
          var ex2 = px + bw2*(0.1+Math.random()*0.7);
          var ey2 = py + bh2*(0.1+Math.random()*0.7);
          var erg = ctx.createRadialGradient(ex2, ey2, 0, ex2, ey2, bw2*0.4);
          erg.addColorStop(0,   'rgba(225,220,205,0.45)');
          erg.addColorStop(0.5, 'rgba(210,205,188,0.2)');
          erg.addColorStop(1,   'transparent');
          ctx.fillStyle = erg; ctx.fillRect(px, py, bw2, bh2);
        }

        // ── Iron staining ── orange-brown bleed on ~15%
        if (Math.random() > 0.85) {
          var ix = px + bw2*(0.3+Math.random()*0.4);
          var iy = py;
          var ilen = bh2 * (0.4 + Math.random()*0.7);
          var ig = ctx.createLinearGradient(ix, iy, ix, iy+ilen);
          ig.addColorStop(0, 'rgba(160,90,30,'+(0.18+Math.random()*0.22)+')');
          ig.addColorStop(1, 'transparent');
          ctx.fillStyle = ig;
          ctx.fillRect(ix-1, iy, 2+Math.random()*3, ilen);
        }

        // ── Surface spalling ── ~10% — exposed lighter clay body
        if (Math.random() > 0.90) {
          ctx.save();
          ctx.beginPath();
          var spx = px + 3 + Math.random()*(bw2-8);
          var spy = py + 2 + Math.random()*(bh2-6);
          var spw = 4 + Math.random()*12, sph = 3 + Math.random()*7;
          ctx.ellipse(spx, spy, spw, sph, Math.random()*Math.PI, 0, Math.PI*2);
          ctx.fillStyle = 'hsl('+Math.round(hv+8)+','+Math.round(sv*0.5)+'%,'+Math.round(lv+22)+'%)';
          ctx.fill();
          // Spall edge — dark shadow on bottom-right
          ctx.strokeStyle = 'rgba(0,0,0,0.35)';
          ctx.lineWidth = 0.8;
          ctx.stroke();
          ctx.restore();
        }

        // ── Chipped corners ── ~18%
        if (Math.random() > 0.82) {
          var corner = Math.floor(Math.random()*4);
          var csz = 3 + Math.random()*7;
          ctx.save();
          ctx.beginPath();
          if (corner === 0) { ctx.moveTo(px,py); ctx.lineTo(px+csz,py); ctx.lineTo(px,py+csz*0.7); }
          else if (corner === 1) { ctx.moveTo(px+bw2,py); ctx.lineTo(px+bw2-csz,py); ctx.lineTo(px+bw2,py+csz*0.7); }
          else if (corner === 2) { ctx.moveTo(px,py+bh2); ctx.lineTo(px+csz,py+bh2); ctx.lineTo(px,py+bh2-csz*0.7); }
          else { ctx.moveTo(px+bw2,py+bh2); ctx.lineTo(px+bw2-csz,py+bh2); ctx.lineTo(px+bw2,py+bh2-csz*0.7); }
          ctx.closePath();
          // Chip exposes mortar/clay beneath
          ctx.fillStyle = 'hsl('+Math.round(hv-5)+','+Math.round(sv*0.6)+'%,'+Math.round(lv+14)+'%)';
          ctx.fill();
          ctx.restore();
        }

        // ── Per-brick surface noise ──
        var nx2 = Math.max(0, px), ny2 = Math.max(0, py);
        var nw2 = Math.min(bw2, w - nx2), nh2 = Math.min(bh2, h - ny2);
        addNoise(ctx, nx2, ny2, nw2, nh2, 25);

        // ── Mortar joint shadow ── deep recess on top and left edges
        // Top horizontal joint
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(px, py, bw2, Math.min(3, gp*0.5));
        // Left vertical joint
        ctx.fillRect(px, py, Math.min(2, gp*0.4), bh2);
        // Bottom highlight (light bounce from mortar below)
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(px, py+bh2-2, bw2, 2);

        // ── Mortar loss ── crumbled/missing mortar exposing dark void, ~14%
        if (Math.random() > 0.86) {
          var mlx = px + Math.random()*(bw2*0.6);
          var mlw2 = 4 + Math.random()*(bw2*0.4);
          // Top joint loss
          ctx.fillStyle = 'rgba(0,0,0,0.55)';
          ctx.fillRect(mlx, py - gp*0.6, mlw2, Math.round(gp*0.7));
        }
        if (Math.random() > 0.90) {
          // Side joint loss
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(px - gp*0.5, py + Math.random()*(bh2*0.5), Math.round(gp*0.6), bh2*0.3 + Math.random()*bh2*0.4);
        }

        x += bw2 + gp;
      }
      row++;
    }

    // ── Global weathering overlays ──────────────────────────────────────────

    // Soot / grime bands — heavier at sill lines and base
    var soot = ctx.createLinearGradient(0, 0, 0, h);
    soot.addColorStop(0,   'rgba(10,8,5,0.12)');
    soot.addColorStop(0.15,'rgba(10,8,5,0.05)');
    soot.addColorStop(0.8, 'rgba(10,8,5,0.04)');
    soot.addColorStop(1,   'rgba(10,8,5,0.14)');
    ctx.fillStyle = soot; ctx.fillRect(0, 0, w, h);

    // Long water bleed streaks — full height, very narrow, semi-transparent
    for (var ws = 0; ws < 20; ws++) {
      var wsx = Math.random() * w;
      var wsy = Math.random() * h * 0.2;
      var wsh = h * 0.3 + Math.random() * h * 0.7;
      var wsw2 = 1 + Math.random() * 7;
      var wsg = ctx.createLinearGradient(wsx, wsy, wsx+(Math.random()-0.5)*6, wsy+wsh);
      wsg.addColorStop(0,    'transparent');
      wsg.addColorStop(0.1,  'rgba(25,18,10,'+(0.1+Math.random()*0.2)+')');
      wsg.addColorStop(0.6,  'rgba(25,18,10,'+(0.06+Math.random()*0.1)+')');
      wsg.addColorStop(1,    'transparent');
      ctx.fillStyle = wsg;
      ctx.fillRect(wsx - wsw2/2, wsy, wsw2, wsh);
    }

    // Algae / lichen patches — low and in sheltered areas
    for (var al = 0; al < 10; al++) {
      var ax = Math.random() * w;
      var ay = h * 0.5 + Math.random() * h * 0.5;
      var ar = 8 + Math.random() * 35;
      var ag = ctx.createRadialGradient(ax, ay, 0, ax, ay, ar);
      var greenish = Math.random() > 0.5;
      ag.addColorStop(0, greenish
        ? 'rgba(58,72,42,0.20)'    // algae green
        : 'rgba(90,88,78,0.15)'); // lichen grey
      ag.addColorStop(1, 'transparent');
      ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(ax, ay, ar, 0, Math.PI*2); ctx.fill();
    }

    // Final grime noise over everything
    addNoise(ctx, 0, 0, w, h, 14);
    return c;
  }

  // Sand float render — exterior texture coat, slightly rough and grainy
  function makeRenderSand(w, h) {
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    var ctx=c.getContext('2d');
    var g=ctx.createLinearGradient(0,0,w*0.5,h);
    g.addColorStop(0,'#d4cfc6'); g.addColorStop(1,'#c8c2b8');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    addNoise(ctx,0,0,w,h,28);
    // Sand particles — coarser stipple than smooth plaster
    var n=Math.round(w*h/25);
    for (var i=0; i<n; i++) {
      var x=Math.random()*w, y=Math.random()*h;
      var r=0.4+Math.random()*2.2;
      ctx.fillStyle=Math.random()>0.5
        ?'rgba(0,0,0,'+(0.06+Math.random()*0.12)+')'
        :'rgba(255,255,255,'+(0.06+Math.random()*0.10)+')';
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    // Float lines — horizontal tool marks from float application
    for (var j=0; j<Math.round(h/4); j++) {
      var fy=Math.random()*h;
      ctx.strokeStyle='rgba(0,0,0,'+(0.02+Math.random()*0.03)+')';
      ctx.lineWidth=0.5+Math.random()*1;
      ctx.beginPath(); ctx.moveTo(0,fy); ctx.lineTo(w,fy); ctx.stroke();
    }
    return c;
  }

  function generateSubstrate(type, w, h) {
    switch (type) {
      case 'concrete_ribbed': return makeConcreteRibbed(w, h);
      case 'concrete_polished':  return makeConcretePolished(w, h);
      case 'concrete_weathered': return makeConcreteWeathered(w, h);
      case 'brick_red':          return makeBrickRed(w, h);
      case 'brick_buff':         return makeBrickBuff(w, h);
      case 'brick_grey':         return makeBrickGrey(w, h);
      case 'brick_old':          return makeBrickOld(w, h);
      case 'limestone':          return makeLimestone(w, h);
      case 'sandstone':          return makeSandstone(w, h);
      case 'render_sand':        return makeRenderSand(w, h);
      case 'plasterboard':       return makePlaster(w, h);
      default:                   return makeConcrete(w, h);
    }
  }

  // ---------------- STATE ----------------
  // Try to hydrate saved colours from localStorage (persists across sessions)
  var _savedFromStorage = [];
  try {
    var raw = localStorage.getItem('keim-saved-colours');
    if (raw) {
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) _savedFromStorage = parsed.slice(0, 30);
    }
  } catch (e) { /* localStorage unavailable — ignore */ }

  var state = {
    image: null,         // HTMLImageElement (or HTMLCanvasElement) of the substrate
    imageW: 0, imageH: 0,
    color: '#9e968b',
    dilutionIdx: 8,      // default to middle of the scale (1:1)
    finish: 'multiply',
    appMode: 'full',     // 'full' | 'mask'
    tool: 'brush',       // 'brush' | 'roller' | 'eraser' | 'eyedropper'
    brushSize: 50,
    brushOpacityIdx: DILUTIONS.length - 1,  // default to 1:0 (full strength)
    sliderPos: 50,       // %
    sliderOrientation: 'vertical',  // 'horizontal' | 'vertical'
    viewMode: 'slider',  // 'slider' | 'overlay'
    showAdvanced: false,
    sampling: false,     // when true, next click on canvas samples a colour
    samples: [],         // [{hex, x, y, matches}] persistent sample history
    saved: _savedFromStorage,  // user-saved colours [{hex, label?}]
    paletteSearch: '',
    dominant: [],        // [{hex, rgb}, ...] auto-extracted from the loaded image
    wallMask: null,      // canvas with alpha-encoded wall-likeness (null if disabled)
    wallOnly: false,     // legacy: only used for full-mode masking
    seedMask: null,      // when set, next paintImage seeds the brush canvas with this
    paintHintShown: false  // true after we've shown the paint-mode hint banner once
  };
  function persistSaved() {
    try { localStorage.setItem('keim-saved-colours', JSON.stringify(state.saved)); }
    catch (e) { /* no-op */ }
  }
  // Convenience getters
  function dilutionValue() { return DILUTIONS[state.dilutionIdx].value; }
  function dilutionLabel() { return DILUTIONS[state.dilutionIdx].label; }

  var refs = {};
  var isDrawing = false, lastPos = null;

  // Persistent offscreen canvas that holds painted brush/roller strokes across
  // re-renders. render() creates new DOM canvas elements each time, which
  // destroys any painted content — so we snapshot the mask before render and
  // restore it afterwards.
  var _persistentMask = document.createElement('canvas');
  var _hasPersistentContent = false;

  function saveMaskContent() {
    if (!refs.maskCanvas || refs.maskCanvas.width === 0) return;
    if (_persistentMask.width !== refs.maskCanvas.width ||
        _persistentMask.height !== refs.maskCanvas.height) {
      _persistentMask.width = refs.maskCanvas.width;
      _persistentMask.height = refs.maskCanvas.height;
    }
    var pctx = _persistentMask.getContext('2d');
    pctx.clearRect(0, 0, _persistentMask.width, _persistentMask.height);
    pctx.drawImage(refs.maskCanvas, 0, 0);
    _hasPersistentContent = true;
  }

  function restoreMaskContent() {
    if (!_hasPersistentContent || !refs.maskCanvas) return;
    if (refs.maskCanvas.width === 0 || refs.maskCanvas.height === 0) return;
    var mctx = refs.maskCanvas.getContext('2d');
    // Only restore if dimensions match (different image = fresh start)
    if (_persistentMask.width === refs.maskCanvas.width &&
        _persistentMask.height === refs.maskCanvas.height) {
      mctx.clearRect(0, 0, refs.maskCanvas.width, refs.maskCanvas.height);
      mctx.drawImage(_persistentMask, 0, 0);
    }
  }
  var isDraggingSlider = false;

  // ---------------- RENDER ----------------
  function render() {
    // Save painted brush/roller content before DOM rebuild destroys the canvases
    if (state.appMode === 'mask') saveMaskContent();

    var app = $('#app');
    app.innerHTML = '';
    app.appendChild(renderHeader());
    var stage = ce('main', {cls:'stage'});
    if (!state.image) {
      stage.appendChild(renderLanding());
    } else {
      stage.appendChild(renderVisualiser());
      stage.appendChild(renderBottomBar());
    }
    app.appendChild(stage);

    if (state.image) {
      requestAnimationFrame(function() {
        updateStageSize();
        paintImage();
        // Restore painted strokes after paintImage initialises the new canvas
        if (state.appMode === 'mask') restoreMaskContent();
        if (state.viewMode === 'slider') updateSliderUI();
      });
    }
  }
